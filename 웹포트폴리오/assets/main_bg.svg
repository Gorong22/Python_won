<svg width="1584" height="814" viewBox="0 0 1584 814" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>* { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }</style>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0A0A0A"/>
    <stop offset="100%" style="stop-color:#111111"/>
  </linearGradient>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#2AC4A8"/>
    <stop offset="100%" style="stop-color:#1DA892"/>
  </linearGradient>
  <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#2AC4A8;stop-opacity:0.15"/>
    <stop offset="100%" style="stop-color:#2AC4A8;stop-opacity:0"/>
  </linearGradient>
</defs>

<!-- 배경 -->
<rect width="1584" height="814" fill="url(#bg)"/>

<!-- 좌상단 발광 -->
<ellipse cx="0" cy="0" rx="600" ry="400" fill="url(#glow)"/>

<!-- 우하단 발광 -->
<ellipse cx="1584" cy="814" rx="500" ry="350" fill="#2AC4A8" opacity="0.06"/>

<!-- 그리드 라인 (수직 극도로 얇게) -->
<line x1="528" y1="0" x2="528" y2="814" stroke="#FFFFFF" stroke-width="0.3" opacity="0.06"/>
<line x1="1056" y1="0" x2="1056" y2="814" stroke="#FFFFFF" stroke-width="0.3" opacity="0.06"/>

<!-- 수평 라인 1개 -->
<line x1="0" y1="680" x2="1584" y2="680" stroke="#FFFFFF" stroke-width="0.3" opacity="0.08"/>

<!-- 좌측 액센트 바 -->
<rect x="0" y="0" width="5" height="814" fill="url(#accent)"/>

<!-- 상단 태그 -->
<rect x="40" y="52" width="120" height="26" rx="13" fill="#2AC4A8" opacity="0.15"/>
<rect x="40" y="52" width="120" height="26" rx="13" fill="none" stroke="#2AC4A8" stroke-width="1" opacity="0.4"/>
<text x="100" y="69" text-anchor="middle" font-size="9" font-weight="700" fill="#2AC4A8" letter-spacing="1.5">PORTFOLIO 2026</text>

<!-- 메인 타이틀 -->
<text x="40" y="220" font-size="96" font-weight="900" fill="#FFFFFF" letter-spacing="-2" opacity="0.95">뉴칸</text>
<text x="40" y="340" font-size="96" font-weight="900" fill="url(#accent)" letter-spacing="-2">브랜드 마케팅</text>
<text x="40" y="440" font-size="96" font-weight="900" fill="#FFFFFF" letter-spacing="-2" opacity="0.95">포트폴리오</text>

<!-- 서브 설명 -->
<text x="44" y="510" font-size="15" fill="#888888" letter-spacing="0.5">리뷰 데이터 8,500+건 기반  ·  검색·콘텐츠·퍼포먼스 통합 전략</text>

<!-- 액센트 언더라인 -->
<rect x="40" y="524" width="280" height="2" rx="1" fill="url(#accent)"/>

<!-- 우측 하단 지원자 정보 -->
<text x="1544" y="626" text-anchor="end" font-size="11" fill="#555555" letter-spacing="1">콘텐츠 마케터 지원자</text>
<text x="1544" y="652" text-anchor="end" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">이형원</text>

<!-- 우측 숫자 장식 -->
<text x="1544" y="200" text-anchor="end" font-size="180" font-weight="900" fill="#FFFFFF" opacity="0.03" letter-spacing="-10">NK</text>

<!-- 하단 메타 -->
<text x="40" y="730" font-size="9" fill="#444444" letter-spacing="1.5">NEWKAN · WHOLEBLENDING  —  BRAND MARKETING STRATEGY</text>
<text x="1544" y="730" text-anchor="end" font-size="9" fill="#444444" letter-spacing="1">2026. 02</text>

<!-- 하단 포인트 -->
<rect x="40" y="750" width="40" height="2" rx="1" fill="#2AC4A8" opacity="0.5"/>
<rect x="88" y="750" width="8" height="2" rx="1" fill="#2AC4A8" opacity="0.2"/>

</svg>
