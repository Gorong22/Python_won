<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제출 완료</title>
  <style>
    body {
      background: linear-gradient(to bottom, #e8f5e9, #c8e6c9);
      font-family: "Noto Sans KR", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .thankyou-box {
      max-width: 600px;
      padding: 40px;
      background: #fff;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      line-height: 1.6;
    }
    .thankyou-box h2 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #2e7d32;
    }
    .thankyou-box p {
      margin: 10px 0;
      font-size: 16px;
      color: #333;
    }
    .cta-btn {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #66bb6a, #43a047);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
    }
    .cta-btn:hover {
      background: linear-gradient(135deg, #388e3c, #2e7d32);
    }
  </style>
</head>
<body>
  <div class="thankyou-box">
    <h2>🌱 참여해 주셔서 감사합니다!</h2>
    <p>여러분의 소중한 응답은 더 나은 서비스와 경험을 만드는 데 큰 힘이 됩니다.</p>
    <p>함께해주신 정성에 깊이 감사드리며, 건강하고 행복한 하루 되시길 바랍니다 🙏</p>
    <a href="https://www.kurly.com" class="cta-btn">건강해지러 가기</a>
  </div>
</body>
</html>
