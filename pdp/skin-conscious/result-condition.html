<script>
document.addEventListener("DOMContentLoaded", () => {
 const testURL = "https://skin-conscious.netlify.app/";

 document.getElementById("share-test").addEventListener("click", async () => {
   if (navigator.share) {
     try {
       await navigator.share({
         title: "이너컬리 피부타입 심리테스트",
         text: "요즘 내 피부는 괜찮은걸까? 지금 바로 나의 피부 타입을 알아보세요 💜",
         url: testURL,
       });
     } catch (err) {
       console.log("공유 취소됨:", err);
     }
   } else {
     navigator.clipboard.writeText(testURL);
     alert("💌 테스트 링크가 복사되었습니다!");
   }
 });
});
</script>
