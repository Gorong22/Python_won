    <div class="container">
      <div class="quiz-container">
        <div class="progress-bar">
          <div class="progress"></div>
        </div>
    <div class="container">
        <div class="result-card">
            <h2>당신은 <span class="highlight">Slim 타입</span></h2>
            <p class="result-subtitle">슬림하고 헬시한 라이프스타일을 추구하는 당신, 건강한 아름다움을 채워보세요.</p>
            <img src="assets/result-slim.svg" alt="Slim 타입 결과 이미지">
            <!-- Gemini Prompt: 슬림하고 헬시한 피부와 바디를 가진 건강한 여성이 간결한 배경에서 가볍게 스트레칭하는 모습. -->
            <p class="result-description">꾸준한 자기 관리를 통해 이미 건강한 라이프스타일에 가까워요. 가볍지만 영양 가득한 식단으로 더 활기찬 하루를 만들어보세요.</p>
            <a href="https://innerkurly.netlify.app/images/slim-hero.jpg" class="btn-result">💪 간단하게 슬림 루틴 시작하기</a>
               <!-- ✅ 테스트 공유 버튼을 테스트 다시하기 위로 배치 -->
   <button class="btn-share ghost" id="share-test">💌 테스트 공유하기</button>

   <a href="index.html" class="btn-retry">테스트 다시하기</a>
 </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
 const testURL = "https://skin-conscious.netlify.app/";

 document.getElementById("share-test").addEventListener("click", async () => {
   if (navigator.share) {
     try {
       await navigator.share({
         title: "이너컬리 피부타입 심리테스트",
         text: "요즘 내 피부는 괜찮은걸까? 지금 바로 나의 피부 타입을 알아보세요 💜",
         url: testURL,
       });
     } catch (err) {
       console.log("공유 취소됨:", err);
     }
   } else {
     navigator.clipboard.writeText(testURL);
     alert("💌 테스트 링크가 복사되었습니다!");
   }
 });
});
</script>

}
