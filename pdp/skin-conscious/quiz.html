<html lang="ko">
<head>

  })(window,document,'script','dataLayer','GTM-KWL72ML2');</script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나의 피부 타입은? - 이너컬리 테스트</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    /* ===== 폼 스타일 (추가 부분) ===== */
    #submit-form {
      display: none;
      margin-top: 30px;
      padding: 24px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    #submit-form h2 {
      font-size: 1.4rem;
      margin-bottom: 12px;
      color: #3c2a82; /* 이너컬리 메인톤 */
    }

    .privacy-note {
      font-size: 0.9rem;
      color: #666;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    #submit-form input,
    #submit-form select {
      width: 100%;
      max-width: 360px;
      padding: 10px 12px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .gender-select {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 10px 0;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }

    .gender-select label {
      flex: 0 0 60px;
      font-weight: 500;
      color: #333;
    }

    #submitBtn.btn-start {
      background-color: #7353ea;
      color: #fff;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 14px;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      max-width: 360px;
    }

    #submitBtn.btn-start:hover {
      background-color: #5e44c8;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KWL72ML2"
      height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div class="container">
    <div class="quiz-container">
      <div class="progress-bar">
        <div class="progress"></div>
      </div>

      <div id="quiz-box">
        <!-- Questions will be injected by script.js -->
      </div>

      <!-- ✅ 마지막 제출 폼 -->
      <div id="submit-form" style="display:none;">
        <h2>결과를 이메일로 받아보세요 📩</h2>
        <p class="privacy-note">
          입력하신 정보는 결과 안내 및 통계 분석 목적으로만 사용되며,<br />
          <strong>5일 이내 자동 폐기됩니다.</strong><br />
          제출 시, 입력하신 메일로 나의 결과와 루틴 리포트를 보내드립니다.
        </p>

        <input type="text" id="name" placeholder="이름 (가명 가능)" required />

        <div class="gender-select">
          <label for="gender">성별</label>
          <select id="gender" required>
            <option value="">선택해주세요</option>
            <option value="여성">여성</option>
            <option value="남성">남성</option>
          </select>
        </div>

        <input type="number" id="age" placeholder="나이" required />
        <input type="email" id="email" placeholder="이메일" required />

        <button id="submitBtn" class="btn-start">결과 확인하기</button>
      </div>
      <!-- 끝 -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
