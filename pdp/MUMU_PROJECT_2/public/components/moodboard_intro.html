<!-- moodboard_intro.html -->
<!-- 무드보드 안내 팝업 컴포넌트 -->
<div
  class="moodboard-intro-overlay"
  id="moodboardIntroOverlay"
  aria-hidden="true"
>
  <div
    class="moodboard-intro-modal"
    role="dialog"
    aria-labelledby="moodboardIntroTitle"
    aria-modal="true"
  >
    <div class="moodboard-intro-content">
      <h2 class="moodboard-intro-title" id="moodboardIntroTitle">
        가입을 환영합니다 🎉
      </h2>

      <div class="moodboard-intro-body">
        <p class="moodboard-intro-text">
          무한의 다양성, 무한의 취향<br />
          무무 가입을 진심으로 감사드려요!
        </p>
        <p class="moodboard-intro-text">
          무무를 더 재미있게 즐기고<br />
          웹툰을 더욱 몰입해서 보기 위해<br />
          무드보드 기능이 있어요.
        </p>
        <p class="moodboard-intro-text">한 번 같이 만들어볼까요?</p>
      </div>

      <div class="moodboard-intro-actions">
        <button
          type="button"
          class="moodboard-intro-btn moodboard-intro-btn-secondary"
          id="moodboardIntroSkipBtn"
          aria-label="아니요, 지금은 웹툰부터 볼래요"
        >
          아니요, 지금은 웹툰부터 볼래요
        </button>
        <button
          type="button"
          class="moodboard-intro-btn moodboard-intro-btn-primary"
          id="moodboardIntroConfirmBtn"
          aria-label="네! 알려주세요!"
        >
          네! 알려주세요!
        </button>
      </div>
    </div>
  </div>
</div>
