<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MUMU – 검색</title>
    <link rel="stylesheet" href="css/tabbar.css" />
    <link rel="stylesheet" href="css/search.css" />
</head>

<body>
    <div class="app-frame">
        <!-- 헤더 -->

                    </svg>
                </button>
            </div>
        </header>

        <!-- 스크롤 -->
        <div class="app-scroll">
            <main class="search-page">

                <!-- 카테고리 필터 -->
                <div class="category-filters">
                    <button class="category-filter active">전체</button>
                    <button class="category-filter">판타지</button>
                    <button class="category-filter">액션</button>
                    <button class="category-filter">일상</button>
                    <button class="category-filter">스릴러</button>
                    <button class="category-filter">코디</button>
                </div>

                <!-- 최근 검색과 비슷한 작품 추천 -->
                <section class="recommendation-section">
                    <h2 class="recommendation-title">최근 검색과 비슷한 작품 추천</h2>
                    <div class="recommendation-cards">
                        <div class="recommendation-card"></div>
                        <div class="recommendation-card"></div>
                        <div class="recommendation-card"></div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div id="tabbar"></div>

    <script src="js/tabbar-init.js"></script>
    <script src="js/search.js" defer></script>
</body>

</html>
