<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MUMU – Explore</title>

  <link rel="stylesheet" href="css/tabbar.css" />
  <link rel="stylesheet" href="css/explore.css" />
</head>

<body>
  <div id="cursor"></div>
  <div class="app-frame">
    <!-- 헤더 -->
    <div id="header"></div>

    <!-- 스크롤 -->
    <div class="app-scroll">
      <main class="explore-page">
        <!-- 취향 탐색 메인 섹션 -->
        <section class="taste-explore-main">
          <!-- 왼쪽 세로 이미지 카드들 -->
          <div class="taste-explore-left">
            <div class="card-group-wrapper">
              <div class="auto-scroll-track">
                <div class="taste-image-card"></div>
                <div class="taste-image-card"></div>
                <div class="taste-image-card"></div>
                <div class="taste-image-card"></div>
                <div class="taste-image-card"></div>
                <div class="taste-image-card"></div>
              </div>
            </div>
          </div>

          <!-- 오른쪽 큰 이미지와 텍스트 -->
          <div class="taste-explore-right">
            <h2 class="taste-explore-title">_님의 취향 탐색</h2>
            <p class="taste-explore-subtitle">나의 취향 탐색해보기</p>
            <div class="taste-main-image"></div>

            <!-- 취향 슬라이더 섹션 -->
            <div class="taste-slider-section">
              <div class="taste-slider-item">
                <span class="taste-slider-label">판타지</span>
                <div class="taste-slider-track">
                  <div class="taste-slider-thumb" style="left: calc(100% - 16px - 2px)"></div>
                </div>
              </div>
              <div class="taste-slider-item">
                <span class="taste-slider-label">액션</span>
                <div class="taste-slider-track">
                  <div class="taste-slider-thumb" style="left: calc(56% - 8px)"></div>
                </div>
              </div>
              <div class="taste-slider-item">
                <span class="taste-slider-label">일상</span>
                <div class="taste-slider-track">
                  <div class="taste-slider-thumb" style="left: calc(16% - 8px)"></div>
                </div>
              </div>
              <div class="taste-slider-item">
                <span class="taste-slider-label">스릴러</span>
                <div class="taste-slider-track">
                  <div class="taste-slider-thumb" style="left: calc(41% - 8px)"></div>
                </div>
              </div>
              <div class="taste-slider-item">
                <span class="taste-slider-label">코미디</span>
                <div class="taste-slider-track">
                  <div class="taste-slider-thumb" style="left: calc(5% - 8px)"></div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- 내 취향 조금 더 알아보기 -->
        <section class="taste-more-section">
          <h2 class="taste-more-title">내 취향 조금 더 알아보기</h2>
          <!-- 장르 필터 태그들 -->
          <div class="genre-filter-tags">
            <div class="genre-filter-tag active">전체</div>
            <div class="genre-filter-tag">로맨스</div>
            <div class="genre-filter-tag">판타지</div>
            <div class="genre-filter-tag">액션</div>
            <div class="genre-filter-tag">스포츠</div>
            <div class="genre-filter-tag">스릴러</div>
            <div class="genre-filter-tag">무협/사극</div>
            <div class="genre-filter-tag">드라마</div>
            <div class="genre-filter-tag">감성</div>
            <div class="genre-filter-tag">개그</div>
            <div class="genre-filter-tag">일상</div>
          </div>
        </section>

        <!-- 취향에 맞는 장르 추천 섹션들 -->
        <section class="section-block">
          <h3 class="section-title-black">취향에 맞는 장르 추천</h3>
          <div class="grid-3">
            <div class="work-card"></div>
            <div class="work-card"></div>
            <div class="work-card"></div>
          </div>
        </section>

        <section class="section-block">
          <h3 class="section-title-black">취향에 맞는 장르 추천</h3>
          <div class="grid-3">
            <div class="work-card"></div>
            <div class="work-card"></div>
            <div class="work-card"></div>
          </div>
        </section>

        <section class="section-block">
          <h3 class="section-title-black">취향에 맞는 장르 추천</h3>
          <div class="grid-3">
            <div class="work-card"></div>
            <div class="work-card"></div>
            <div class="work-card"></div>
          </div>
        </section>

        <section class="section-block">
          <h3 class="section-title-black">취향에 맞는 장르 추천</h3>
          <div class="grid-3">
            <div class="work-card"></div>
            <div class="work-card"></div>
            <div class="work-card"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <div id="tabbar"></div>

  <script src="js/tabbar-init.js"></script>
  <script src="js/explore.js" defer></script>
</body>

</html>
