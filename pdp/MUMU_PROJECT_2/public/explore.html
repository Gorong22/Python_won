              <div class="work-card"><img src="assets/random/c4.webp" loading="lazy" style="object-fit: cover; width: 100%; height: 100%;" alt="" /></div>

        <!-- 🔥 검색 후 화면 -->
        <div id="afterSearch" style="display: none">
          <h3 class="search-section-title">인기 검색 작품</h3>

        </div>
      </main>
    </div>

    <!-- 하단 탭바 -->
    <div id="tabbar" class="tabbar">
    </div>

    <script>
      /* ========================== 
         Header 커스터마이징
      ========================== */
      fetch("components/header.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("header").innerHTML = html;
          // 헤더 내용 변경
          const headerTitle = document.querySelector("#header .header-title");
          if (headerTitle) {
            headerTitle.remove();
          }
          const headerLeft = document.querySelector("#header .header-left");
          if (headerLeft) {
            headerLeft.innerHTML = '<a href="../index.html" style="display: flex; width: 100%; height: 100%; align-items: center; justify-content: center;"><img src="assets/logos/mumu-logo.webp" alt="MUMU Logo" style="max-width: 100%; max-height: 100%; object-fit: contain;" loading="lazy"></a>';
          }
        })
        .catch((error) => console.error("Error fetching header.html:", error));

      /* ========================== 
         Tabbar 로드
      ========================== */
      fetch("components/tabbar.html")
        .then((r) => r.text())
        .then((html) => (document.getElementById("tabbar").innerHTML = html))
        .catch((error) => console.error("Error fetching tabbar.html:", error));
    </script>
    <script src="js/explore.js" defer></script>
