    <!-- 댓글 모달 최소 스타일 (기존 comment-modal 오버레이에도 적용되도록 범용) -->
    <style>
      #commentModal.comment-modal,
      #comment-modal.comment-modal-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 9999;
      }
      #commentModal .comment-modal-backdrop,
      #comment-modal .comment-modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
      }
      #commentModal .comment-modal-sheet,
      #comment-modal .comment-modal {
        position: relative;
        width: 100%;
        max-width: 480px;
        background: #fff;
        border-top-left-radius: 16px;
        border-top-right-radius: 16px;
        padding: 16px;
        box-sizing: border-box;
        animation: slideUp 0.25s ease;
      }
      #commentModal .comment-modal-header,
      #comment-modal .comment-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 700;
        font-size: 16px;
        margin-bottom: 12px;
      }
      #commentModal .comment-modal-close,
      #comment-modal .comment-modal-close {
        border: none;
        background: none;
        font-size: 18px;
        cursor: pointer;
      }
      #commentModal .comment-modal-body,
      #comment-modal .comment-modal-content {
        overflow-y: auto;
        overflow-x: hidden;
        font-size: 14px;
        color: #333;
        display: flex !important;
        flex-direction: column !important;
        align-items: stretch !important;
        -webkit-overflow-scrolling: touch;
      }
      #commentModal .comment-empty,
      #comment-modal .comment-empty {
        color: #888;
        text-align: center;
        padding: 24px 0;
      }
      @keyframes slideUp {
        from {
          transform: translateY(30px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
    </style>

    <!-- Login Status & UI Toggle -->
    <script type="module" src="/js/reader_auth.js"></script>
    <script type="module">
      // 로그인 버튼 클릭 핸들러 (기본 핸들러)
      window.handleLoginClick = function (event) {
        event.preventDefault();
        event.stopPropagation();

        const loginBtn = event.target.closest("#headerLoginBtn");
        if (!loginBtn) return;

        // 이미 로그인 상태인지 확인
        const isLoggedIn = loginBtn.textContent === "로그아웃";

        if (isLoggedIn) {
          // 로그아웃 처리
          handleLogout();
        } else {
          // 로그인 페이지로 이동
          window.location.href = "login.html";
        }
      };

      // 로그인 상태 체크 및 UI 토글
      async function updateLoginUI() {
        const loginBtn = document.getElementById("headerLoginBtn");
        if (!loginBtn) {
          console.warn("[로그인UI] 헤더 로그인 버튼을 찾을 수 없습니다.");
          return;
        }

        try {
          // Firebase Auth 상태 확인 (전역 함수 사용)
          // getCurrentFirebaseUser가 없으면 잠시 대기 후 재시도
          if (typeof window.getCurrentFirebaseUser !== "function") {
            console.log("[로그인UI] getCurrentFirebaseUser 대기 중...");
            await new Promise((resolve) => setTimeout(resolve, 500));

            if (typeof window.getCurrentFirebaseUser !== "function") {
              console.warn(
                "[로그인UI] getCurrentFirebaseUser를 찾을 수 없습니다."
              );
              // 기본값으로 로그인 버튼 설정
              loginBtn.textContent = "로그인";
              loginBtn.onclick = window.handleLoginClick;
              return;
            }
          }

          const user = await window.getCurrentFirebaseUser();

          // localStorage도 확인 (이중 체크)
          const loggedInStorage =
            localStorage.getItem("mumu_logged_in") === "true";

          const isLoggedIn = user !== null || loggedInStorage;

          console.log("[로그인UI] 로그인 상태 체크:");
          console.log("  - Firebase User:", user ? "있음" : "없음");
          console.log("  - localStorage:", loggedInStorage);
          console.log("  - 최종 상태:", isLoggedIn ? "로그인됨" : "비로그인");

          if (isLoggedIn) {
            // 로그인 상태 → 로그아웃 버튼으로 변경
            loginBtn.textContent = "로그아웃";
            loginBtn.onclick = window.handleLoginClick;
            console.log("[로그인UI] ✅ 로그아웃 버튼으로 변경");
          } else {
            // 비로그인 상태 → 로그인 버튼으로 변경
            loginBtn.textContent = "로그인";
            loginBtn.onclick = window.handleLoginClick;
            console.log("[로그인UI] ✅ 로그인 버튼으로 변경");
          }
        } catch (error) {
          console.error("[로그인UI] ❌ 로그인 상태 체크 실패:", error);
          // 에러 발생 시 기본값으로 로그인 버튼 표시
          loginBtn.textContent = "로그인";
          loginBtn.onclick = window.handleLoginClick;
        }
      }

      // 로그아웃 처리
      window.handleLogout = async function handleLogout() {
        console.log("[로그아웃] 로그아웃 버튼 클릭");

        if (!confirm("로그아웃 하시겠습니까?")) {
          return;
        }

        try {
          // Firebase 로그아웃
          if (window.signOutFirebase) {
            await window.signOutFirebase();
          } else {
            // 모듈에서 직접 import
            const { signOutFirebase } = await import("/js/reader_auth.js");
            await signOutFirebase();
          }

          console.log("[로그아웃] ✅ 로그아웃 성공");

          // UI 즉시 업데이트
          const loginBtn = document.getElementById("headerLoginBtn");
          if (loginBtn) {
            loginBtn.textContent = "로그인";
            loginBtn.onclick = window.handleLoginClick;
          }

          // 페이지 새로고침 (선택사항)
          // window.location.reload();
        } catch (error) {
          console.error("[로그아웃] ❌ 로그아웃 실패:", error);
          alert("로그아웃 중 오류가 발생했습니다.");
        }
      };

      // 페이지 로드 시 로그인 상태 체크 (약간의 지연을 두어 Firebase 로드 대기)
      const checkLoginState = async () => {
        // 방금 로그인한 경우 즉시 업데이트
        const justLoggedIn =
          localStorage.getItem("mumu_just_logged_in") === "true";

        if (justLoggedIn) {
          // 즉시 업데이트 시도
          await updateLoginUI();
          localStorage.removeItem("mumu_just_logged_in");
        } else {
          // Firebase가 로드될 때까지 약간 대기
          await new Promise((resolve) => setTimeout(resolve, 300));
          await updateLoginUI();
        }
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", checkLoginState);
      } else {
        checkLoginState();
      }

      // Firebase Auth 상태 변경 감지하여 UI 업데이트
      if (window.setupAuthStateListener) {
        window.setupAuthStateListener((user) => {
          console.log(
            "[로그인UI] Auth 상태 변경 감지:",
            user ? "로그인됨" : "로그아웃됨"
          );
          updateLoginUI();
        });
      }
    </script>
