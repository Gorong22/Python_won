<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MUMU – 무드보드 상세</title>
  <link rel="stylesheet" href="css/tabbar.css" />
  <link rel="stylesheet" href="css/community.css" />
  <style>
    .moodboard-detail-container {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    .moodboard-detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .moodboard-creator-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .creator-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }
    .creator-avatar-placeholder {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #666;
    }
    .moodboard-title {
      font-size: 24px;
      font-weight: 700;
      margin: 16px 0;
    }
    .moodboard-canvas {
      background: #fafafa;
      border-radius: 8px;
      padding: 16px;
      min-height: 400px;
      position: relative;
    }
    .moodboard-block {
      position: absolute;
      cursor: pointer;
    }
    .moodboard-block.image-block img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }
    .moodboard-block.text-block {
      padding: 8px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 4px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 8px;
    }
    .follow-btn {
      padding: 8px 16px;
      border: 1px solid #ddd;
      border-radius: 20px;
      background: white;
      cursor: pointer;
      font-size: 14px;
    }
    .follow-btn.following {
      background: #000;
      color: white;
      border-color: #000;
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <div class="app-scroll">
      <div class="moodboard-detail-container">
        <div class="moodboard-detail-header">
          <button class="back-btn" onclick="history.back()">←</button>
          <div class="moodboard-creator-info" id="creatorInfo">
            <!-- 동적으로 채워짐 -->
          </div>
          <button class="follow-btn" id="followBtn" onclick="toggleFollow()">팔로우</button>
        </div>
        <h1 class="moodboard-title" id="moodboardTitle">무드보드</h1>
        <div class="moodboard-canvas" id="moodboardCanvas">
          <!-- 무드보드 블록들이 여기에 렌더링됨 -->
        </div>
      </div>
    </div>
    <div id="tabbar"></div>
  </div>

  <script src="js/tabbar-init.js"></script>
  <script type="module" src="js/moodboard-detail.js"></script>
</body>
</html>
