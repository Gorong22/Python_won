<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>MUMU – 시리즈 상세</title>
    <link rel="stylesheet" href="css/tabbar.css" />
    <style>
      body {
        margin: 0;
        background: #fafafa;
        font-family: Pretendard, sans-serif;
      }
      .app-frame {
        width: 100%;
        max-width: 390px;
        margin: 0 auto;
        background: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .app-scroll {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 80px;
      }

      .series-header {
        padding: 40px 20px 24px;
        text-align: center;
        background: #fff;
      }
      .series-thumb-large {
        width: 140px;
        height: 140px;
        margin: 0 auto 20px;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      }
      .series-thumb-large img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .series-title {
        font-size: 24px;
        font-weight: 800;
        margin: 0 0 12px;
        color: #111;
        letter-spacing: -0.5px;
      }
      .series-desc {
        font-size: 14px;
        color: #666;
        line-height: 1.6;
        margin: 0;
        padding: 0 20px;
      }

      .episode-list-section {
        padding: 24px 20px;
      }
      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .section-title {
        font-size: 18px;
        font-weight: 700;
        margin: 0;
        color: #111;
      }
      .episode-count {
        font-size: 14px;
        color: #ff5e00;
        font-weight: 600;
      }

      .episodes-grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .episode-card {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px;
        border-radius: 12px;
        background: #fff;
        border: 1px solid #f0f0f0;
        transition: all 0.2s;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
      }
      .episode-card:active {
        transform: scale(0.98);
        background: #fafafa;
      }

      .ep-thumb {
        width: 72px;
        height: 72px;
        border-radius: 8px;
        overflow: hidden;
        background: #f5f5f5;
        flex-shrink: 0;
      }
      .ep-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .ep-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .ep-title {
        font-size: 15px;
        font-weight: 600;
        color: #111;
        margin: 0;
      }
      .ep-meta {
        font-size: 12px;
        color: #999;
      }
      .ep-number {
        font-size: 14px;
        font-weight: 700;
        color: #ff5e00;
        width: 40px;
        text-align: right;
      }

      .binge-btn-fixed {
        position: fixed;
        bottom: 84px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 40px);
        max-width: 350px;
        height: 56px;
        background: #000;
        color: #fff;
        border: none;
        border-radius: 28px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        z-index: 100;
      }
      .back-btn-top {
        position: absolute;
        top: 16px;
        left: 16px;
        width: 40px;
        height: 40px;
        background: #fff;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        border: none;
        cursor: pointer;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div class="app-frame">
      <button class="back-btn-top" onclick="history.back()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path
            d="M15 18L9 12L15 6"
            stroke="black"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <main class="app-scroll">
        <header class="series-header" id="seriesHeader">
          <div class="series-thumb-large" id="seriesThumb">
            <img src="" alt="" />
          </div>
          <h1 class="series-title" id="seriesTitle">로딩 중...</h1>
          <p class="series-desc" id="seriesDesc"></p>
        </header>

        <section class="episode-list-section">
          <div class="section-header">
            <h2 class="section-title">전체 회차</h2>
            <span class="episode-count" id="episodeCount">0화</span>
          </div>
          <div class="episodes-grid" id="episodesGrid">
            <!-- episodes here -->
          </div>
        </section>
      </main>

      <button class="binge-btn-fixed" id="bingeBtn">
        <span>첫 화부터 보기</span>
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </button>

      <div id="tabbar"></div>
    </div>

    <script src="/js/app_init.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/api-functions.js" defer></script>
    <script type="module" src="js/supabase-auth.js"></script>
    <script src="js/tabbar-init.js"></script>
    <script type="module" src="js/series_detail.js"></script>
  </body>
</html>
