<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUMU – 업로드</title>
  <link rel="stylesheet" href="css/tabbar.css" />
  <link rel="stylesheet" href="css/upload.css" />
</head>

<body>
  <div class="app-frame">
    <!-- 헤더 -->
    <header class="upload-header">
      <button class="back-btn" id="backBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="20" viewBox="0 0 21 20" fill="none">
          <path
            d="M0.292893 9.29289C-0.0976311 9.68342 -0.0976311 10.3166 0.292893 10.7071L6.65685 17.0711C7.04738 17.4616 7.68054 17.4616 8.07107 17.0711C8.46159 16.6805 8.46159 16.0474 8.07107 15.6569L2.41421 10L8.07107 4.34315C8.46159 3.95262 8.46159 3.31946 8.07107 2.92893C7.68054 2.53841 7.04738 2.53841 6.65685 2.92893L0.292893 9.29289ZM19.7139 11C20.2662 11 20.7139 10.5523 20.7139 10C20.7139 9.44772 20.2662 9 19.7139 9V10V11ZM1 10V11H19.7139V10V9H1V10Z"
            fill="black" />
        </svg>
      </button>
      <div class="header-actions">
        <button class="temp-save-btn" id="tempSaveBtn">임시저장</button>
        <button class="publish-btn" id="publishBtn">발행</button>
      </div>
    </header>

    <main class="app-scroll">
      <div class="upload-container">
        <h2 class="title">게시물 업로드</h2>

        <!-- 이미지 업로드 -->
        <label class="label image-label">이미지 업로드</label>

        <div class="upload-image-area" id="uploadImageArea">
          <div class="feed-item add-btn">+</div>
          <div class="upload-image-placeholder"></div>
          <input type="file" class="file-input" id="imageInput" accept="image/*" />
        </div>

        <!-- 제목 -->
        <label class="label">제목</label>
        <div class="input-wrapper">
          <input type="text" class="input" id="titleInput" placeholder="텍스트 입력" />
        </div>

        <!-- 태그 -->
        <label class="label">태그</label>
        <div class="input-wrapper tag-input-wrapper">
          <input type="text" class="input tag-input" id="tagInput" placeholder="텍스트 입력" />
          <button class="tag-search-btn" id="tagSearchBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z"
                stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M21 21L16.65 16.65" stroke="#999" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <!-- 태그 칩 영역 -->
        <div class="tag-chips" id="tagChips">
          <div class="tag-chip">
            <span>판타지</span>
            <button class="tag-chip-remove">×</button>
          </div>
          <div class="tag-chip">
            <span>액션</span>
            <button class="tag-chip-remove">×</button>
          </div>
        </div>

        <!-- 본문 입력 -->
        <label class="label">본문 입력</label>
        <div class="textarea-wrapper">
          <textarea class="textarea" id="descriptionInput" placeholder="텍스트를 입력하세요"></textarea>
        </div>

        <!-- 공개 여부 -->
        <label class="label">공개 여부</label>
        <div class="privacy-toggle-wrapper">
          <span class="privacy-label">공개</span>
          <label class="privacy-toggle">
            <input type="checkbox" id="privacyToggle" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </main>

    <!-- Bottom Tab Bar -->
    <div id="tabbar"></div>
  </div>
  <script src="js/tabbar-init.js"></script>
  <script src="js/upload.js" defer></script>
</body>

</html>
