<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MUMU – 에피소드 뷰어</title>
    <link rel="stylesheet" href="css/tabbar.css" />
    <link rel="stylesheet" href="css/creator_episode_viewer.css" />
    <link rel="stylesheet" href="css/feed-modals.css" />
</head>

<body>
    <div class="app-frame">
        <!-- SCROLL영역 -->
        <main class="app-scroll">
            <!-- HEADER -->
            <section class="episode-viewer-header">
                <button class="episode-viewer-back-btn" onclick="history.back()" aria-label="뒤로가기">
                    <svg xmlns="http://www.w3.org/2000/svg" width="21" height="20" viewBox="0 0 21 20" fill="none">
                        <path
                            d="M0.292893 9.29289C-0.0976311 9.68342 -0.0976311 10.3166 0.292893 10.7071L6.65685 17.0711C7.04738 17.4616 7.68054 17.4616 8.07107 17.0711C8.46159 16.6805 8.46159 16.0474 8.07107 15.6569L2.41421 10L8.07107 4.34315C8.46159 3.95262 8.46159 3.31946 8.07107 2.92893C7.68054 2.53841 7.04738 2.53841 6.65685 2.92893L0.292893 9.29289ZM19.7139 11C20.2662 11 20.7139 10.5523 20.7139 10C20.7139 9.44772 20.2662 9 19.7139 9V10V11ZM1 10V11H19.7139V10V9H1V10Z"
                            fill="black" />
                    </svg>
                </button>
                <h1 class="episode-viewer-title">깜장 고양이 짜루 -시즌 2-</h1>
                <button class="episode-viewer-menu-btn" aria-label="메뉴">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="5" r="1.5" fill="#1A1A1A" />
                        <circle cx="10" cy="10" r="1.5" fill="#1A1A1A" />
                        <circle cx="10" cy="15" r="1.5" fill="#1A1A1A" />
                    </svg>
                </button>
            </section>

            <!-- COMIC PANEL -->
            <section class="episode-viewer-content">
                <div class="comic-panel">
                    <img src="" alt="웹툰 패널" class="comic-panel-image" />
                </div>
            </section>

            <!-- INTERACTION BAR -->
            <section class="episode-interaction-bar">
                <div class="episode-stats">
                    <button class="episode-stat-btn" type="button" aria-label="좋아요">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none"
                            class="stat-icon">
                            <path
                                d="M15.8434 4.05117C15.4768 3.68448 15.0417 3.3936 14.5627 3.19514C14.0837 2.99668 13.5704 2.89453 13.0519 2.89453C12.5335 2.89453 12.0201 2.99668 11.5411 3.19514C11.0621 3.3936 10.627 3.68448 10.2605 4.05117L9.49981 4.81182L8.73916 4.05117C7.99882 3.31083 6.9947 2.89491 5.94771 2.89492C4.90071 2.89492 3.89659 3.31083 3.15626 4.05117C2.41592 4.79151 2 5.79562 2 6.84262C2 7.88962 2.41592 8.89373 3.15626 9.63407L3.91691 10.3947L9.49981 15.9776L15.0827 10.3947L15.8434 9.63407C16.21 9.26756 16.5009 8.83238 16.6994 8.35342C16.8979 7.87445 17 7.36108 17 6.84262C17 6.32417 16.8979 5.81079 16.6994 5.33183C16.5009 4.85286 16.21 4.41769 15.8434 4.05117Z"
                                stroke="#A0A0A0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <span class="stat-count">30</span>
                    </button>
                    <button class="episode-stat-btn" type="button" aria-label="댓글" onclick="openCommentModal()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none"
                            class="stat-icon">
                            <path
                                d="M16 8.61112C16.0027 9.63769 15.7628 10.6504 15.3 11.5667C14.7512 12.6647 13.9076 13.5882 12.8636 14.2339C11.8195 14.8795 10.6164 15.2217 9.38888 15.2222C8.36231 15.2249 7.34964 14.9851 6.43333 14.5222L2 16L3.47778 11.5667C3.01494 10.6504 2.7751 9.63769 2.77778 8.61112C2.77825 7.3836 3.12047 6.18046 3.76611 5.13644C4.41175 4.09243 5.3353 3.24879 6.43333 2.70002C7.34964 2.23719 8.36231 1.99735 9.38888 2.00002H9.77777C11.3989 2.08946 12.9301 2.77372 14.0782 3.9218C15.2263 5.06987 15.9105 6.60108 16 8.22223V8.61112Z"
                                stroke="#A0A0A0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <span class="stat-count">30</span>
                    </button>
                    <button class="episode-stat-btn" type="button" aria-label="저장">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none"
                            class="stat-icon">
                            <path
                                d="M14.5 15.2557L9 12.4758L3.50001 15.2557V3.36393C3.49864 3.202 3.59456 3.04577 3.76841 2.92679C3.85083 2.86987 3.95109 2.82441 4.06283 2.7933C4.17456 2.7622 4.29531 2.74612 4.41741 2.74609H13.5837C13.7056 2.74621 13.8261 2.76234 13.9377 2.79344C14.0492 2.82455 14.1493 2.86996 14.2316 2.92679C14.4057 3.04595 14.5016 3.20245 14.5 3.36462V15.2557Z"
                                stroke="#A0A0A0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <span class="stat-count">30</span>
                    </button>
                </div>
                <div class="episode-navigation">
                    <button class="episode-nav-btn episode-nav-prev" aria-label="이전 에피소드">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M15 18L9 12L15 6" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                    <span class="episode-nav-label">EP.01</span>
                    <button class="episode-nav-btn episode-nav-next" aria-label="다음 에피소드">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M9 18L15 12L9 6" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
            </section>
        </main>

        <script src="js/feed-stat-interaction.js"></script>

        <!-- Comment Modal -->
        <div id="comment-modal" class="comment-modal-overlay" style="display: none">
            <div class="comment-modal">
                <div class="comment-modal-header">
                    <h2 class="comment-modal-title">36개의 댓글</h2>
                    <button class="comment-modal-close" onclick="closeCommentModal()" aria-label="닫기">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M18 6L6 18M6 6L18 18" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
                <div class="comment-modal-content">
                    <div class="comment-item">
                        <div class="comment-avatar"></div>
                        <div class="comment-body">
                            <div class="comment-header">
                                <span class="comment-author">작가 이름</span>
                                <span class="comment-date">2025.11.27</span>
                            </div>
                            <p class="comment-text">얼레리꼴레리 이거 봐라~</p>
                            <div class="comment-actions">
                                <button class="comment-action-btn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18"
                                        fill="none" class="comment-action-icon">
                                        <path
                                            d="M15.8434 4.05117C15.4768 3.68448 15.0417 3.3936 14.5627 3.19514C14.0837 2.99668 13.5704 2.89453 13.0519 2.89453C12.5335 2.89453 12.0201 2.99668 11.5411 3.19514C11.0621 3.3936 10.627 3.68448 10.2605 4.05117L9.49981 4.81182L8.73916 4.05117C7.99882 3.31083 6.9947 2.89491 5.94771 2.89492C4.90071 2.89492 3.89659 3.31083 3.15626 4.05117C2.41592 4.79151 2 5.79562 2 6.84262C2 7.88962 2.41592 8.89373 3.15626 9.63407L3.91691 10.3947L9.49981 15.9776L15.0827 10.3947L15.8434 9.63407C16.21 9.26756 16.5009 8.83238 16.6994 8.35342C16.8979 7.87445 17 7.36108 17 6.84262C17 6.32417 16.8979 5.81079 16.6994 5.33183C16.5009 4.85286 16.21 4.41769 15.8434 4.05117Z"
                                            stroke="#A0A0A0" stroke-width="1.5" stroke-linecap="round"
                                            stroke-linejoin="round" />
                                    </svg>
                                    <span>30</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Save Modal -->
        <div id="save-modal" class="save-modal-overlay" style="display: none">
            <div class="save-modal">
                <h2 class="save-modal-title">나의 무드보드로 이동하시겠습니까?</h2>
                <div class="save-modal-buttons">
                    <button class="save-modal-btn save-modal-btn-cancel" onclick="closeSaveModal()">아니오</button>
                    <button class="save-modal-btn save-modal-btn-confirm" onclick="confirmSaveModal()">무드보드
                        바로가기</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
