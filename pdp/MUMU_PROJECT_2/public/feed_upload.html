<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUMU – 업로드</title>
  <link rel="stylesheet" href="css/tabbar.css" />
  <link rel="stylesheet" href="css/upload.css" />
</head>

<body>
  <div class="app-frame">
    <!-- 헤더 -->
    <header class="upload-header">
      <button class="back-btn" id="backBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="20" viewBox="0 0 21 20" fill="none">
          <path
            d="M0.292893 9.29289C-0.0976311 9.68342 -0.0976311 10.3166 0.292893 10.7071L6.65685 17.0711C7.04738 17.4616 7.68054 17.4616 8.07107 17.0711C8.46159 16.6805 8.46159 16.0474 8.07107 15.6569L2.41421 10L8.07107 4.34315C8.46159 3.95262 8.46159 3.31946 8.07107 2.92893C7.68054 2.53841 7.04738 2.53841 6.65685 2.92893L0.292893 9.29289ZM19.7139 11C20.2662 11 20.7139 10.5523 20.7139 10C20.7139 9.44772 20.2662 9 19.7139 9V10V11ZM1 10V11H19.7139V10V9H1V10Z"
            fill="black" />
        </svg>
      </button>
      <div class="header-actions">
        <button class="temp-save-btn" id="tempSaveBtn">임시저장</button>
        <button class="publish-btn" id="publishBtn">발행</button>
      </div>
    </header>

    <main class="app-scroll">
      <div class="upload-container">
        <h2 class="title">작품 업로드</h2>

        <!-- 타입 선택 -->
        <div class="select-row">
          <button class="select-btn active" data-format="short">숏툰</button>
          <button class="select-btn" data-format="long">롱툰</button>
        </div>

        <!-- 이미지 업로드 -->
        <label class="label image-label">이미지 업로드</label>
        <div class="upload-image-area" id="uploadImageArea">
          <div class="upload-image-placeholder">이미지 업로드</div>
          <input type="file" class="file-input" id="imageInput" accept="image/*" />
        </div>

        <!-- 작품 제목 -->
        <label class="label">작품 제목</label>
        <div class="input-wrapper">
          <input type="text" class="input" id="titleInput" placeholder="" />
        </div>

        <!-- 작품 설명 -->
        <label class="label">작품 설명</label>
        <div class="textarea-wrapper">
          <textarea class="textarea" id="descriptionInput" placeholder=""></textarea>
        </div>

        <!-- 장르 -->
        <label class="label">장르</label>
        <div class="tag-area" id="tagArea">
          <button class="tag-btn">로맨스</button>
          <button class="tag-btn">판타지</button>
          <button class="tag-btn">액션</button>
          <button class="tag-btn">스포츠</button>
          <button class="tag-btn">스릴러</button>
          <button class="tag-btn">무협/사극</button>
          <button class="tag-btn">드라마</button>
          <button class="tag-btn">감성</button>
          <button class="tag-btn">개그</button>
          <button class="tag-btn">일상</button>
        </div>
      </div>
    </main>

    <!-- Bottom Tab Bar -->
    <div id="tabbar"></div>
  </div>
  <script src="js/tabbar-init.js"></script>
  <script src="js/feed_upload.js" defer></script>
</body>

</html>
