<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUMU – Creator MY PAGE</title>
  <link rel="stylesheet" href="css/tabbar.css" />
  <link rel="stylesheet" href="css/mypage_creator.css" />
</head>

<body>
  <div class="app-frame">
    <!-- SCROLL영역 -->
    <main class="app-scroll">
      <!-- HEADER (무조건 scroll 안쪽) -->
      <!-- <header class="header">
        <div class="header-title">MUMU</div>
        <div class="header-right">마이페이지</div>
      </header> -->

      <!-- PROFILE -->
      <section class="profile-box">
        <div class="profile-bg"></div>

        <!-- <button class="creator-mode-btn">창작자모드</button> -->

        <div class="profile-content">
          <div class="profile-header-row">
            <div class="profile-avatar-wrapper">
              <div class="profile-avatar"></div>
              <div class="setting-icon">
                <img src="/public/assets/icons/setting.svg" alt="setting">
              </div>
            </div>
            <div class="profile-follow">
              <div class="follow">
                <div class="follow-num">12</div>
                <div class="follow-label">팔로우</div>
              </div>
              <div class="follow-line">
                <div class="line"></div>
              </div>
              <div class="follow">
                <div class="follow-num">12</div>
                <div class="follow-label">팔로워</div>
              </div>
            </div>
          </div>
          <div class="profile-name">박햇살</div>
          <div class="tag-list">
            <span class="tag">액션</span>
            <span class="tag">판타지</span>
            <span class="tag">개그</span>
          </div>
          <div class="profile-desc">작가 설명을 적는 구간<br />링크 연동</div>
        </div>
      </section>

      <!-- TAB -->
      <div class="tab-wrap">
        <div class="tab active" onclick="goMyFeed()">MY FEED</div>
        <div class="tab" onclick="goStudio()">스튜디오</div>
      </div>

      <!-- FEED GRID -->
      <section class="feed-grid">
        <div class="feed-item add-btn">+</div>
        <div class="feed-item"></div>
        <div class="feed-item"></div>
        <div class="feed-item"></div>
      </section>
    </main>

    <!-- 하단 탭바 -->
    <div id="tabbar" class="tabbar">
    </div>


    <script>
      /* ========================== 
         Tabbar 로드
      ========================== */
      fetch("components/tabbar.html")
        .then((r) => r.text())
        .then((html) => (document.getElementById("tabbar").innerHTML = html))
        .catch((error) => console.error("Error fetching tabbar.html:", error));
    </script>
    <script src="js/mypage_creator.js"></script>
</body>

</html>
