<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>로그인 | Inner Kurly</title>
    <meta name="theme-color" content="#5F0080" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />

    <!-- GA4 placeholder -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"
    ></script>

      window.dataLayer = window.dataLayer || [];
      function gtag() {

      gtag("config", "G-XXXXXXX");

    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-KWL72ML2");
    </script>
    <!-- End Google Tag Manager -->
  </head>

  <body data-active="my">
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-KWL72ML2"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="mobile-wrap">
      <!-- ======================
           HEADER
      ======================= -->
      <header class="app-header">
        <button
          class="icon-btn"
          onclick="if(history.length>1)history.back();else location.href='./index.html';"
          aria-label="뒤로가기"
        >
          ←
        </button>
        <a class="logo" href="./index.html">
          <img
            src="./assets/logo-innerkurly-purple.png"
            alt="Inner Kurly"
            class="logo-img"
          />
        </a>
        <nav class="nav">
          <a href="./signup.html">회원가입</a>
          <a href="./login.html" class="active">로그인</a>
        </nav>
      </header>

      <!-- ======================
           MAIN
      ======================= -->
      <main class="container">
        <section class="login-section">
          <span class="badge">로그인</span>
          <h2>다시 만나서 반가워요 💜</h2>

          <form id="login-form" class="login-form">
            <div class="form-group">
              <label for="email">이메일</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="example@kurly.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">비밀번호</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="비밀번호를 입력하세요"
                required
              />
            </div>

            <button type="submit" class="login-btn">로그인</button>

            <p class="small" style="margin-top: 12px">
              아직 회원이 아니신가요?&nbsp;
              <a href="./signup.html" style="color: #5f0080; font-weight: 600"
                >회원가입</a
              >
            </p>
          </form>
        </section>
      </main>

      <!-- ======================
           FOOTER
      ======================= -->
      <footer class="app-footer">
        <div class="pay-row">
          <img src="./assets/payment-icons.png" alt="결제수단" />
        </div>
        <p>© Inner Kurly · Daily Premium Gift</p>
      </footer>

      <!-- ======================
           BOTTOM NAV
      ======================= -->
      <nav class="bottom-nav">
        <a href="./index.html" data-key="home"><span>🏠</span><em>홈</em></a>
        <a href="./plates.html" data-key="plates"
          ><span>🍽️</span><em>플레이트</em></a
        >
        <a href="./tests.html" data-key="test"
          ><span>🧪</span><em>테스트</em></a
        >
        <a href="./cart.html" data-key="cart"
          ><span>🛒</span><em>장바구니</em></a
        >
        <a href="./mypage.html" data-key="my" class="active"
          ><span>👤</span><em>마이</em></a
        >
      </nav>

      <script>
        (function () {
          const k = document.body.getAttribute("data-active");
          document.querySelectorAll(".bottom-nav a").forEach((a) => {
            if (a.dataset.key === k) a.classList.add("active");
          });
        })();
      </script>
    </div>

    <script src="./scripts/common.js"></script>
    <script src="./scripts/login.js"></script>
  </body>
</html>
