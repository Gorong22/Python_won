<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | 이너컬리</title>

    <!-- Font & Main Styles -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <!-- Header (공통) -->
    <header class="header">
      <nav class="nav container">
        <a href="index.html" class="nav__logo">Inner Kurly</a>
        <ul class="nav__menu">
          <li class="nav__item"><a href="index.html#plates" class="nav__link">추천 식단</a></li>
          <li class="nav__item"><a href="index.html#pricing" class="nav__link">구독 상품</a></li>
          <li class="nav__item"><a href="index.html#reviews" class="nav__link">고객 후기</a></li>
          <li class="nav__item"><a href="index.html#challenge" class="nav__link">챌린지</a></li>
        </ul>
        <div class="header__util">
          <a href="login.html" class="btn btn--ghost btn--small">로그인</a>
          <a href="signup.html" class="btn btn--ghost btn--small">회원가입</a>
          <a href="cart.html" class="btn btn--ghost btn--small cart-btn">🛒 <span class="cart-badge">0</span></a>
        </div>
      </nav>
    </header>

    <!-- ✅ 로그인 페이지 본문 -->
    <section class="auth-section">
      <div class="auth-form-container">
        <h1 class="section__title" style="margin-bottom: 20px;">로그인</h1>
        <p class="section__subtitle" style="margin-bottom: 40px;">
          건강한 루틴의 시작, 이너컬리 멤버가 되어보세요.
        </p>

        <form class="auth-form">
          <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" placeholder="이메일을 입력하세요" required />
          </div>

          <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required />
          </div>

          <div class="form-group--checkbox">
            <input type="checkbox" id="remember" name="remember" />
            <label for="remember">로그인 상태 유지</label>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--primary btn--large">로그인</button>
          </div>
        </form>

        <!-- 소셜 로그인 -->
        <div class="social-login">
          <p class="social-login__title">또는 SNS 계정으로 로그인</p>
          <div class="social-login__buttons">
            <button class="social-btn social-btn--kakao" aria-label="카카오 로그인">
              <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#FEE500"/></svg>
            </button>
            <button class="social-btn social-btn--naver" aria-label="네이버 로그인">
              <svg viewBox="0 0 32 32"><path d="M7 7h6l6 9V7h6v18h-6l-6-9v9H7z" /></svg>
            </button>
            <button class="social-btn social-btn--google" aria-label="구글 로그인">
              <svg viewBox="0 0 32 32"><path fill="#4285F4" d="M16 13v6h8a7 7 0 1 0-2-7z"/><path fill="#34A853" d="M7 19a9 9 0 0 0 14 5l-4-3a5 5 0 1 1 0-8l4-3A9 9 0 0 0 7 19z"/></svg>
            </button>
          </div>
        </div>

        <!-- 회원가입 링크 -->
        <div class="auth-link">
          계정이 없으신가요? <a href="signup.html">회원가입</a>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer__container">
        <p>© 2025 Inner Kurly. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
