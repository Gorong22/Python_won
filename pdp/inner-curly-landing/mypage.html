<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>마이페이지 | Inner Kurly</title>
    <meta name="theme-color" content="#5F0080" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />

    <!-- GA4 placeholder -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-XXXXXXX");
    </script>
  </head>
  <body data-active="my">
    <div class="mobile-wrap">
      <!-- ======================
         HEADER
    ======================= -->
      <header class="app-header">
        <button
          class="icon-btn"
          onclick="if(history.length>1)history.back();else location.href='./index.html';"
          aria-label="뒤로가기"
        >
          ←
        </button>
        <a class="logo" href="./index.html">
          <img
            src="./assets/logo-innerkurly-purple.png"
            alt="Inner Kurly"
            class="logo-img"
          />
        </a>
        <nav class="nav">
          <a href="./signup.html">회원가입</a>
          <a href="./login.html">로그인</a>
        </nav>
      </header>

      <!-- 로딩 스피너 -->
      <div id="app-loader" class="loader active">
        <div class="spinner"></div>
      </div>

      <!-- ======================
         MAIN
    ======================= -->
      <main class="container mypage">
        <!-- ① 프로필 카드 -->
        <section class="card pad center" id="section-profile">
          <h2 class="h2">내 정보</h2>
          <div id="user-info" class="text user-info-box">
            <!-- JS에서 사용자 정보 렌더링 -->
          </div>
          <div class="row" style="justify-content: center">
            <button id="btn-logout" class="btn btn--ghost">로그아웃</button>
          </div>
        </section>

        <!-- ② 서베이 결과 -->
        <section class="card pad" id="section-survey">
          <h3 class="h3">나의 서베이 결과</h3>
          <div id="survey-result" class="text small">
            결과를 불러오는 중입니다...
          </div>
        </section>

        <!-- ③ 추천 플레이트 -->
        <section class="card pad" id="section-plate">
          <h3 class="h3">추천 플레이트</h3>
          <div id="plate-recommend" class="text small">
            <p>회원님의 서베이 결과에 따라 맞춤 플레이트를 준비 중이에요 🍽️</p>
          </div>
        </section>
      </main>

      <!-- ======================
         FOOTER
    ======================= -->
      <footer class="app-footer">
        <div class="pay-row">
          <img src="./assets/payment-icons.png" alt="결제수단" />
        </div>
        <p>© Inner Kurly · Daily Premium Gift</p>
      </footer>

      <!-- ======================
         BOTTOM NAV
    ======================= -->
      <nav class="bottom-nav">
        <a href="./index.html" data-key="home"><span>🏠</span><em>홈</em></a>
        <a href="./plates.html" data-key="plates"
          ><span>🍽️</span><em>플레이트</em></a
        >
        <a href="./tests.html" data-key="test"
          ><span>🧪</span><em>테스트</em></a
        >
        <a href="./cart.html" data-key="cart"
          ><span>🛒</span><em>장바구니</em></a
        >
        <a href="./mypage.html" data-key="my"><span>👤</span><em>마이</em></a>
      </nav>

      <script>
        (function () {
          const k = document.body.getAttribute("data-active");
          document.querySelectorAll(".bottom-nav a").forEach((a) => {
            if (a.dataset.key === k) a.classList.add("active");
          });
        })();
      </script>
    </div>

    <!-- ======================
       SCRIPTS
  ======================= -->
    <script src="./scripts/common.js"></script>

    <script>
      // scripts/mypage.js 통합 버전
      document.addEventListener("DOMContentLoaded", async () => {
        const u = Auth.current(); // common.js의 Auth 객체 사용
        const userBox = document.getElementById("user-info");
        const surveyBox = document.getElementById("survey-result");
        const plateBox = document.getElementById("plate-recommend");
        const loader = document.getElementById("app-loader");

        // 로딩 시작
        loader.classList.add("active");

        // 로그인 상태 확인
        if (u && u.email) {
          userBox.innerHTML = `
            <p><strong>이름:</strong> ${u.name || "-"}</p>
            <p><strong>이메일:</strong> ${u.email}</p>
            <p><strong>성별:</strong> ${u.gender || "-"}</p>
            <p><strong>나이:</strong> ${u.age || "-"}</p>
          `;

          // ✅ 서베이 결과 불러오기
          try {
            const res = await fetch(
              \`https://script.google.com/macros/s/AKfycbxxxxxxxxxxxxxx/exec?email=\${encodeURIComponent(
                u.email
              )}\`
            );
            const data = await res.json();

            if (data && data.resultType) {
              // 결과 표시
              surveyBox.innerHTML = `
                <p>회원님의 서베이 결과는 <strong>${data.resultType}</strong> 유형이에요 💫</p>
                <a href="plate-${data.resultType.toLowerCase()}.html" class="btn btn--primary small">
                  추천 플레이트 보러가기
                </a>
              `;

              // 추천 문구 표시
              const plateMsg = getPlateMessage(data.resultType);
              plateBox.innerHTML = `<p>${plateMsg}</p>`;
            } else {
              surveyBox.innerHTML = `
                아직 설문 결과가 없습니다.<br />
                <a href="./tests.html" class="btn btn--primary small">설문하러 가기</a>
              `;
              plateBox.innerHTML = `
                <p>회원님의 서베이 결과에 따라 맞춤 플레이트를 준비 중이에요 🍽️</p>
              `;
            }
          } catch (err) {
            console.error(err);
            surveyBox.innerHTML = `<p>결과를 불러오는 중 오류가 발생했습니다.</p>`;
            plateBox.innerHTML = `<p>추천 정보를 불러올 수 없습니다.</p>`;
          }
        } else {
          // 로그인 안 된 상태
          userBox.innerHTML = `
            <p>로그인이 필요합니다.</p>
            <a href="./login.html" class="btn btn--primary small">로그인</a>
          `;
          surveyBox.innerHTML = `
            <p>서베이 결과를 보려면 로그인 해주세요.</p>
          `;
          plateBox.innerHTML = `
            <p>로그인 후 맞춤 플레이트를 확인할 수 있습니다.</p>
          `;
        }

        // 로딩 종료
        loader.classList.remove("active");

        // ✅ 로그아웃 버튼 클릭 이벤트
        document.addEventListener("click", (e) => {
          if (e.target && e.target.id === "btn-logout") {
            Auth.logout();
            alert("로그아웃 되었습니다.");
            location.href = "./index.html";
          }
        });
      });

      // ✅ 결과 유형별 추천 문구
      function getPlateMessage(type) {
        switch (type.toLowerCase()) {
          case "burnout":
            return "에너지가 고갈된 번아웃형에게는 Detox Plate가 잘 어울려요 🧘‍♀️";
          case "recovery":
            return "회복형인 당신께는 Glow Plate로 활력을 채워보세요 ✨";
          case "balance":
            return "균형형은 Balance Plate로 일상의 조화를 유지해보세요 ⚖️";
          case "void":
            return "공허형에게는 Slim Plate로 가볍게 리듬을 되찾는 걸 추천드려요 🌿";
          default:
            return "회원님의 결과에 맞는 플레이트를 준비 중이에요 🍱";
        }
      }
    </script>
  </body>
</html>
