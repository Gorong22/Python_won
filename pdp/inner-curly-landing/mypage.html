<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>마이페이지 | Inner Kurly</title>
    <meta name="theme-color" content="#5F0080" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />

    <!-- GA4 placeholder -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-XXXXXXX");
    </script>

    <style>
      /* ✅ 추가된 마이페이지 전용 스타일 */
      .info-box {
        background: #faf8fb;
        border-radius: 10px;
        padding: 16px;
        margin: 10px 0;
        text-align: left;
        font-size: 15px;
        line-height: 1.8;
      }
      .mypage .card {
        margin-bottom: 20px;
      }
      .mypage .h2,
      .mypage .h3 {
        color: #5f0080;
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body data-active="my">
    <div class="mobile-wrap">
      <!-- HEADER -->
      <header class="app-header">
        <button
          class="icon-btn"
          onclick="if(history.length>1)history.back();else location.href='./index.html';"
          aria-label="뒤로가기"
        >
          ←
        </button>
        <a class="logo" href="./index.html">
          <img
            src="./assets/logo-innerkurly-purple.png"
            alt="Inner Kurly"
            class="logo-img"
          />
        </a>
        <nav class="nav">
          <a href="./signup.html">회원가입</a>
          <a href="./login.html">로그인</a>
        </nav>
      </header>

      <!-- 로딩 스피너 -->
      <div id="app-loader" class="loader active">
        <div class="spinner"></div>
      </div>

      <!-- MAIN -->
      <main class="container mypage">
        <!-- 내 정보 -->
        <section class="card pad center">
          <h2 class="h2">내 정보</h2>
          <div id="user-info"></div>
          <button
            id="btn-logout"
            class="btn btn--secondary"
            style="margin-top: 12px"
          >
            로그아웃
          </button>
        </section>

        <!-- 서베이 결과 -->
        <section class="card pad">
          <h3 class="h3">나의 서베이 결과</h3>
          <div id="survey-result" class="text small">
            결과를 불러오는 중입니다...
          </div>
        </section>

        <!-- 추천 플레이트 -->
        <section class="card pad">
          <h3 class="h3">추천 플레이트</h3>
          <div id="plate-recommend" class="text small">
            <p>회원님의 서베이 결과에 따라 맞춤 플레이트를 준비 중이에요 🍽️</p>
          </div>
        </section>
      </main>

      <!-- FOOTER -->
      <footer class="app-footer">
        <div class="pay-row">
          <img src="./assets/payment-icons.png" alt="결제수단" />
        </div>
        <p>© Inner Kurly · Daily Premium Gift</p>
      </footer>

      <!-- BOTTOM NAV -->
      <nav class="bottom-nav">
        <a href="./index.html" data-key="home"><span>🏠</span><em>홈</em></a>
        <a href="./plates.html" data-key="plates"
          ><span>🍽️</span><em>플레이트</em></a
        >
        <a href="./tests.html" data-key="test"
          ><span>🧪</span><em>테스트</em></a
        >
        <a href="./cart.html" data-key="cart"
          ><span>🛒</span><em>장바구니</em></a
        >
        <a href="./mypage.html" data-key="my" class="active"
          ><span>👤</span><em>마이</em></a
        >
      </nav>
    </div>

    <!-- SCRIPT -->
    <script src="./scripts/common.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const u = Auth.current();
        const userBox = document.getElementById("user-info");
        const surveyBox = document.getElementById("survey-result");
        const plateBox = document.getElementById("plate-recommend");
        const loader = document.getElementById("app-loader");
        loader.classList.add("active");

        if (u && u.email) {
          userBox.innerHTML = `
            <div class="info-box">
              <p><strong>이름:</strong> ${u.name || "-"}</p>
              <p><strong>이메일:</strong> ${u.email}</p>
            </div>
          `;

          try {
            const res = await fetch(
              \`https://script.google.com/macros/s/AKfycbxxxxxxxxxxxxxx/exec?email=\${encodeURIComponent(u.email)}\`
            );
            const data = await res.json();

            if (data && data.resultType) {
              surveyBox.innerHTML = `
                <p>${u.name || "회원"}님의 결과는 <strong>${data.resultType}</strong> 유형이에요 💜</p>
                <a href="plate-${data.resultType.toLowerCase()}.html"
                   class="btn btn--primary small" style="margin-top:8px;">
                   추천 플레이트 보기</a>`;
              plateBox.innerHTML = `<p>${getPlateMessage(data.resultType)}</p>`;
            } else {
              surveyBox.innerHTML = `
                <p>아직 설문을 완료하지 않으셨어요.</p>
                <a href="./tests.html" class="btn btn--primary small">설문하러 가기</a>`;
            }
          } catch (err) {
            console.error(err);
            surveyBox.innerHTML = `<p>결과를 불러오는 중 오류가 발생했습니다.</p>`;
          }
        } else {
          userBox.innerHTML = `<p>로그인이 필요합니다.</p>
            <a href="./login.html" class="btn btn--primary small">로그인</a>`;
          surveyBox.innerHTML = `<p>서베이 결과를 보려면 로그인 해주세요.</p>`;
          plateBox.innerHTML = `<p>로그인 후 맞춤 플레이트를 확인할 수 있습니다.</p>`;
        }

        loader.classList.remove("active");

        document.addEventListener("click", (e) => {
          if (e.target && e.target.id === "btn-logout") {
            Auth.logout();
            alert("로그아웃 되었습니다.");
            location.href = "./index.html";
          }
        });
      });

      function getPlateMessage(type) {
        switch (type.toLowerCase()) {
          case "burnout": return "에너지가 고갈된 번아웃형에는 Detox Plate가 잘 어울려요 🧘‍♀️";
          case "recovery": return "회복형인 당신께는 Glow Plate로 활력을 채워보세요 ✨";
          case "balance": return "균형형은 Balance Plate로 일상의 조화를 유지해보세요 ⚖️";
          case "void": return "공허형에게는 Slim Plate로 가볍게 리듬을 되찾아보세요 🌿";
          default: return "회원님의 결과에 맞는 플레이트를 준비 중이에요 🍱";
        }
      }
    </script>
  </body>
</html>
