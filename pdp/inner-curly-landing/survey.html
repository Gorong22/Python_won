<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>회원 설문 | Inner Kurly</title>
    <meta name="theme-color" content="#5F0080" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body data-active="my">
    <div class="mobile-wrap">
      <!-- HEADER -->
      <header class="app-header">
        <button
          class="icon-btn"
          onclick="if(history.length>1)history.back();else location.href='./index.html';"
          aria-label="뒤로가기"
        >
          ←
        </button>
        <a class="logo" href="./index.html">
          <img
            src="./assets/logo-innerkurly-purple.png"
            alt="Inner Kurly"
            class="logo-img"
          />
        </a>
        <nav class="nav">
          <a href="./signup.html">회원가입</a><a href="./login.html">로그인</a>
        </nav>
      </header>

      <!-- MAIN -->
      <main class="container">
        <section class="card pad center">
          <span class="badge">회원 설문</span>
          <h2 class="h2" id="welcome-text">당신에게 맞는 루틴을 설계해요</h2>

          <div id="qwrap" class="q-card"></div>

          <div
            class="row"
            style="justify-content: space-between; margin-top: 16px"
          >
            <button class="btn" id="prev">이전</button>
            <button class="btn btn--primary" id="next">다음</button>
          </div>
        </section>
      </main>

      <!-- FOOTER -->
      <footer class="app-footer">
        <div class="pay-row">
          <img src="./assets/payment-icons.png" alt="결제수단" />
        </div>
        <p>© Inner Kurly · Daily Premium Gift</p>
      </footer>

      <!-- BOTTOM NAV -->
      <nav class="bottom-nav">
        <a href="./index.html" data-key="home"><span>🏠</span><em>홈</em></a>
        <a href="./plates.html" data-key="plates"
          ><span>🍽️</span><em>플레이트</em></a
        >
        <a href="./tests.html" data-key="test"
          ><span>🧪</span><em>테스트</em></a
        >
        <a href="./cart.html" data-key="cart"
          ><span>🛒</span><em>장바구니</em></a
        >
        <a href="./mypage.html" data-key="my"><span>👤</span><em>마이</em></a>
      </nav>
    </div>

    <!-- RESULT MODAL -->
    <div class="modal-backdrop" id="result-modal" style="display: none">
      <div class="modal">
        <header>회원가입 완료 🎉</header>
        <div class="body">
          <p class="text" id="result-title"></p>
          <ul
            id="result-reasons"
            class="text small"
            style="text-align: left; line-height: 1.6"
          ></ul>
          <p id="result-solution" class="text" style="margin-top: 12px"></p>
        </div>
        <div class="footer">
          <button class="btn btn--primary" id="go-plate">
            추천 플레이트 보기
          </button>
          <a class="btn btn--ghost" href="./mypage.html">나중에 보기</a>
        </div>
      </div>
    </div>

    <script src="./scripts/common.js"></script>
    <script src="./scripts/survey.js"></script>
  </body>
</html>
