<div id="global-header"></div>
<script>
(function () {
  if (/index\.html?$/i.test(location.pathname)) return;
  const mount = document.getElementById("global-header");
  if (!mount) return;
  fetch("index.html")
    .then((res) => res.text())
    .then((html) => {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const header = doc.querySelector("header");
      mount.innerHTML = header ? header.outerHTML : "";
    })
    .catch((err) => console.error("헤더 로드 실패:", err));
})();
</script>

    <script>
      const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjDBgcESaxWMdWiR_7d1SljLIMAO6zlsIZY3LYJFEk1NkVYNix3Gk0KoqqSVGAZw0m/exec";
    
      // 🔹 로딩 오버레이 설정
      const loadingOverlay = document.createElement('div');
      loadingOverlay.id = "loading-overlay";
      loadingOverlay.style.cssText = `
        display:none;
        position:fixed;
        top:0; left:0;
        width:100%; height:100%;
        background:rgba(255,255,255,0.85);
        z-index:9999;
        justify-content:center;
        align-items:center;
        font-size:18px;
        color:#5f0080;
        font-weight:600;
      `;
      loadingOverlay.innerText = "제출 중입니다. 잠시만 기다려주세요...";
      document.body.appendChild(loadingOverlay);
    
      // 🔹 폼 제출 이벤트
      document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
    
        let data = {};
        [
          "name", "gender", "age", "email",
          "service_q1", "service_q2", "service_q3",
          "brand_q1", "brand_q2",
          "content_q1", "content_q2",
          "ai_q1", "ai_q2",
          "future_q1", "future_q2"
        ].forEach(k => {
          const val = formData.getAll(k);
          data[k] = val.length ? val.join(", ") : "";
        });
    
        data.password = "1234";
        data.timestamp = new Date().toISOString();
    
        // 🔹 전송
        loadingOverlay.style.display = "flex";
        fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
          body: Object.keys(data)
            .map(k => encodeURIComponent(k) + "=" + encodeURIComponent(data[k]))
            .join("&")
        })
        .then(response => {
          loadingOverlay.style.display = "none";
          if (response.ok) return response.json();
          throw new Error('Network response was not ok.');
        })
        .then(res => {
          alert("참여해주셔서 감사합니다! 설문이 정상적으로 제출되었습니다 😊");
          form.reset();
          window.location.href = 'index.html';
        })
        .catch(error => {
          loadingOverlay.style.display = "none";
          alert("오류가 발생했습니다. 다시 시도해주세요.");
        });
      });
    </script>
