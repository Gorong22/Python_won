<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이너컬리 회원가입</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { background-color: #f9f9f9; }
        .signup-container { max-width: 600px; margin: 50px auto; padding: 40px; background-color: #fff; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .signup-container h1 { text-align: center; margin-bottom: 30px; font-size: 28px; color: #333; }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: bold; font-size: 16px; }
        .form-group input[type="text"], .form-group input[type="email"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        .form-group .checkbox-group label, .form-group .radio-group label { font-weight: normal; display: inline-block; margin-right: 20px; }
        .form-group input[type="checkbox"], .form-group input[type="radio"] { margin-right: 8px; }
        .form-group .other-input { margin-top: 10px; }
        .submit-btn { width: 100%; padding: 15px; background-color: #5f0080; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background-color 0.3s; }
        .submit-btn:hover { background-color: #4b0066; }
        .password-notice { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #888; }
    </style>
</head>
<body>
    <div class="signup-container">
        <h1>회원가입 & 설문</h1>
        <form id="signupForm">
            <!-- Form Fields... -->
            <div class="form-group">
                <label>[기본 정보]</label>
                <input type="text" id="name" name="name" placeholder="이름 (필수)" required>
            </div>
            <div class="form-group">
                <input type="email" id="email" name="email" placeholder="이메일 (필수)" required>
            </div>
            <div class="form-group">
                <label>[이너뷰티 고민]</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="concerns" value="피부 광채"> 피부 광채</label>
                    <label><input type="checkbox" name="concerns" value="다이어트/체중 관리"> 다이어트/체중 관리</label>
                    <label><input type="checkbox" name="concerns" value="독소 배출/장 건강"> 독소 배출/장 건강</label>
                    <label><input type="checkbox" name="concerns" value="피로 회복/컨디션"> 피로 회복/컨디션</label>
                    <label><input type="checkbox" name="concerns" value="영양 균형/식습관"> 영양 균형/식습관</label>
                    <label><input type="checkbox" name="concerns" value="기타"> 기타 <input type="text" name="concern_other" class="other-input" placeholder="기타 고민 입력"></label>
                </div>
            </div>
            <div class="form-group">
                <label>[생활 습관]</label>
                <p>식습관</p>
                <div class="radio-group">
                    <label><input type="radio" name="diet_habit" value="가공식품 多"> 가공식품 多</label>
                    <label><input type="radio" name="diet_habit" value="균형 잡힌 식사"> 균형 잡힌 식사</label>
                    <label><input type="radio" name="diet_habit" value="자주 외식"> 자주 외식</label>
                </div>
                 <p style="margin-top: 15px;">영양제 섭취 습관</p>
                <div class="radio-group">
                    <label><input type="radio" name="supplement_habit" value="매일"> 매일</label>
                    <label><input type="radio" name="supplement_habit" value="가끔"> 가끔</label>
                    <label><input type="radio" name="supplement_habit" value="안함"> 안함</label>
                </div>
            </div>
            <div class="form-group">
                <label>[관심 항목]</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="interests" value="맞춤형 식단"> 맞춤형 식단</label>
                    <label><input type="checkbox" name="interests" value="영양제 추천"> 영양제 추천</label>
                    <label><input type="checkbox" name="interests" value="피부·다이어트"> 피부·다이어트</label>
                    <label><input type="checkbox" name="interests" value="장 건강"> 장 건강</label>
                </div>
            </div>
            <button type="submit" class="submit-btn">가입 및 설문 완료하기</button>
            <p class="password-notice">파일럿 테스트 중입니다. 모든 계정 비밀번호는 1234로 통일됩니다.</p>
        </form>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5I9T-x28x2iYb_sJixTN1Ae9pqT57pNMcv1K7Xmb63sVEDVuh7zmLbAoDSa96hQuG/exec";

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const form = e.target;
            const email = form.email.value;
            localStorage.setItem('userEmail', email);

            const formData = new FormData(form);
            const data = {};
            for (let [key, value] of formData.entries()) {
                if (data[key]) {
                    data[key] += ", " + value;
                } else {
                    data[key] = value;
                }
            }

            data.password = "1234";
            data.timestamp = new Date().toISOString();

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(data),
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(() => {
                alert("가입해주셔서 감사합니다. 곧 더 나은 서비스를 준비하겠습니다.");
                form.reset();
                window.location.href = 'index.html';
            })
            .catch(error => {
                console.error('Error:', error);
                alert("오류가 발생했습니다. 다시 시도해주세요.");
            });
        });
    </script>

</body>
</html>
