<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>회원가입 | Inner Kurly</title>
    <meta name="theme-color" content="#5F0080" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <!-- GA4 placeholder -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-XXXXXXX");
    </script>
  </head>
  <body data-active="my">
    <div class="mobile-wrap">
      <!-- HEADER -->
      <header class="app-header">
        <button
          class="icon-btn"
          onclick="if(history.length>1)history.back();else location.href='./index.html';"
          aria-label="뒤로가기"
        >
          ←
        </button>
        <a class="logo" href="./index.html">
          <img
            src="./assets/logo-innerkurly-purple.png"
            alt="Inner Kurly"
            class="logo-img"
          />
        </a>
        <nav class="nav">
          <a href="./signup.html">회원가입</a>
          <a href="./login.html">로그인</a>
        </nav>
      </header>

      <!-- MAIN -->
      <main class="container">
        <section class="card pad center signup-section">
          <span class="badge">시작하기</span>
          <h2 class="h2">회원가입</h2>
          <p class="text small">
            가입 후 테스트 / 설문 / 구독 서비스를 이용하실 수 있어요.
          </p>

          <!-- ✅ 회원가입 폼 -->
          <form id="signup-form" class="signup-form">
            <label>
              <input type="text" name="name" placeholder="이름" required />
            </label>

            <div class="gender-row">
              <label>
                <input type="radio" name="gender" value="남성" required />
                남성
              </label>
              <label>
                <input type="radio" name="gender" value="여성" required />
                여성
              </label>
            </div>

            <label>
              <input
                type="number"
                name="age"
                placeholder="나이"
                min="10"
                max="100"
                required
              />
            </label>

            <label>
              <input type="email" name="email" placeholder="이메일" required />
            </label>

            <button class="btn btn--primary" type="submit">다음</button>
          </form>
        </section>
      </main>

      <!-- FOOTER -->
      <footer class="app-footer">
        <div class="pay-row">
          <img src="./assets/payment-icons.png" alt="결제수단" />
        </div>
        <p>© Inner Kurly · Daily Premium Gift</p>
      </footer>

      <nav class="bottom-nav">
        <a href="./index.html" data-key="home"><span>🏠</span><em>홈</em></a>
        <a href="./plates.html" data-key="plates"
          ><span>🍽️</span><em>플레이트</em></a
        >
        <a href="./tests.html" data-key="test"
          ><span>🧪</span><em>테스트</em></a
        >
        <a href="./cart.html" data-key="cart"
          ><span>🛒</span><em>장바구니</em></a
        >
        <a href="./mypage.html" data-key="my"><span>👤</span><em>마이</em></a>
      </nav>
      <script>
        (function () {
          const k = document.body.getAttribute("data-active");
          document.querySelectorAll(".bottom-nav a").forEach((a) => {
            if (a.dataset.key === k) a.classList.add("active");
          });
        })();
      </script>
    </div>
    <script src="./scripts/common.js"></script>
    <script src="./scripts/signup.js"></script>
  </body>
</html>
