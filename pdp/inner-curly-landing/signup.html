           <!-- ✅ index.html의 Header 자동 로드 -->
<div id="global-header"></div>
<script>
(function () {
  // index.html에는 이미 헤더가 있으니 스킵
  if (/index\.html?$/i.test(location.pathname)) return;

  const mount = document.getElementById("global-header");
  if (!mount) return;

  fetch("index.html")
    .then((res) => res.text())
    .then((html) => {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const header = doc.querySelector("header");
      mount.innerHTML = header ? header.outerHTML : "";

      // 🔧 헤더가 DOM에 붙은 후에 이벤트 다시 연결
      const toggle = mount.querySelector(".nav__toggle");
      const menu   = mount.querySelector(".nav__menu");
      if (toggle && menu) {
        toggle.addEventListener("click", () => {
          toggle.classList.toggle("is-open");
          menu.classList.toggle("is-open");
          // (선택) 메뉴 열릴 때 스크롤 잠그기
          document.body.classList.toggle(
            "no-scroll",
            menu.classList.contains("is-open")
          );
        }, { passive: true });
      }
    })
    .catch((err) => console.error("헤더 로드 실패:", err));
})();
</script>
