<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>장바구니</title>
    <meta name="theme-color" content="#5F0080" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />

    <!-- GA4 placeholder -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-XXXXXXX");
    </script>
  </head>
  <body data-active="cart">
    <div class="mobile-wrap">
      <header class="app-header">
        <button
          class="icon-btn"
          onclick="if(history.length>1)history.back();else location.href='./index.html';"
          aria-label="뒤로가기"
        >
          ←
        </button>
        <a class="logo" href="./index.html"
          ><img
            src="./assets/logo-innerkurly-purple.png"
            alt="Inner Kurly"
            class="logo-img"
        /></a>
        <nav class="nav">
          <a href="./signup.html">회원가입</a><a href="./login.html">로그인</a>
        </nav>
      </header>
      <div id="app-loader" class="loader active">
        <div class="spinner"></div>
      </div>

      <main class="container">
        <section class="card pad center">
          <h2 class="h2">장바구니</h2>
          <div id="cart-items" class="col" style="text-align: left"></div>
          <hr class="divider" />
          <div class="row" style="justify-content: space-between">
            <strong>총액</strong>
            <div class="price" id="cart-total">0원</div>
          </div>
        </section>
      </main>
      <div class="toast" aria-live="polite"></div>

      <footer class="app-footer">
        <div class="pay-row">
          <img src="./assets/footer_img.png" alt="하단로고" />
        </div>
        <p>© Inner Kurly · Daily Premium Gift</p>
      </footer>

      <nav class="bottom-nav">
        <a href="./index.html" data-key="home"><span>🏠</span><em>홈</em></a>
        <a href="./plates.html" data-key="plates"
          ><span>🍽️</span><em>플레이트</em></a
        >
        <a href="./tests.html" data-key="test"
          ><span>📝</span><em>테스트</em></a
        >
        <a href="./cart.html" data-key="cart"
          ><span>🛒</span><em>장바구니</em></a
        >
        <a href="./mypage.html" data-key="mypage"
          ><span>👤</span><em>마이페이지</em></a
        >
      </nav>

      <script>
        (function () {
          const k = document.body.getAttribute("data-active");
          document.querySelectorAll(".bottom-nav a").forEach((a) => {
            if (a.dataset.key === k) a.classList.add("active");
          });
        })();
      </script>
    </div>
    <script src="./scripts/common.js"></script>
    <script src="./scripts/cart.js"></script>
  </body>
</html>
