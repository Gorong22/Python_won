<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니 | 이너컬리</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="index.html" class="nav__logo">Inner Kurly</a>
            <ul class="nav__menu">
                <li class="nav__item"><a href="index.html#plates">이너플레이트</a></li>
                <li class="nav__item"><a href="index.html#reviews">후기</a></li>
                <li class="nav__item"><a href="index.html#app">루션 앱</a></li>
                <li class="nav__item"><a href="index.html#challenge">챌린지</a></li>
                <li class="nav__item"><a href="index.html#members">멤버스</a></li>
                <li class="nav__item"><a href="index.html#faq">FAQ</a></li>
            </ul>
            <div class="header__util">
                <a href="login.html" class="btn btn--ghost btn--small">로그인</a>
                <a href="signup.html" class="btn btn--ghost btn--small">회원가입</a>
                <a href="cart.html" class="btn btn--ghost btn--small cart-btn">
                    <span class="cart-badge">0</span>
                </a>
            </div>
            <button class="nav__toggle" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
        </nav>
    </header>

    <main>
        <section class="cart-section section">
            <div class="container">
                <h2 class="section__title">장바구니</h2>
                <div class="cart-items" id="cart-items">
                    <!-- Cart items will be populated by JS -->
                    <div class="cart-item">
                        <img src="assets/plate-glow-hero.png" alt="Glow Plate" class="cart-item__image">
                        <div class="cart-item__details">
                            <h3>Glow Plate</h3>
                            <p>피부 속부터 빛나는 투명함</p>
                        </div>
                        <div class="cart-item__quantity">
                            <button class="quantity-minus" data-id="glow">-</button>
                            <input type="text" value="1" min="1" data-id="glow" class="quantity-input">
                            <button class="quantity-plus" data-id="glow">+</button>
                        </div>
                        <div class="cart-item__price">35,000원</div>
                    </div>
                    <div class="cart-item">
                        <img src="assets/plate-slim-hero.png" alt="Slim Plate" class="cart-item__image">
                        <div class="cart-item__details">
                            <h3>Slim Plate</h3>
                            <p>가볍지만 균형 잡힌 하루</p>
                        </div>
                        <div class="cart-item__quantity">
                            <button class="quantity-minus" data-id="slim">-</button>
                            <input type="text" value="1" min="1" data-id="slim" class="quantity-input">
                            <button class="quantity-plus" data-id="slim">+</button>
                        </div>
                        <div class="cart-item__price">32,000원</div>
                    </div>
                </div>
                <div class="cart-summary">
                    <p>총액: <span id="cart-total">67,000원</span></p>
                    <button class="btn btn--primary">구매하기</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__container container">
            <p>&copy; 2025 Inner Kurly. All rights reserved.</p>
            <div class="footer__links">
                <a href="#">이용약관</a>
                <a href="#">개인정보처리방침</a>
            </div>
        </div>
    </footer>

    <script src="app.js" defer></script>

    <!-- Purchase Confirmation Modal -->
    <div class="modal-overlay" id="purchase-modal">
        <div class="modal-content">
            <h3>구매해주셔서 감사합니다 🙏</h3>
            <p>이너컬리와 함께 건강한 변화를 시작하세요!</p>
            <button class="btn btn--primary" id="modal-confirm-btn">확인</button>
        </div>
    </div>
</body>
</html>
