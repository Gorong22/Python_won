<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | 이너컬리</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="index.html" class="nav__logo">Inner Kurly</a>
            <ul class="nav__menu">
                <li class="nav__item"><a href="index.html#plates">이너플레이트</a></li>
                <li class="nav__item"><a href="index.html#reviews">후기</a></li>
                <li class="nav__item"><a href="index.html#app">루션 앱</a></li>
                <li class="nav__item"><a href="index.html#challenge">챌린지</a></li>
                <li class="nav__item"><a href="index.html#members">멤버스</a></li>
                <li class="nav__item"><a href="index.html#faq">FAQ</a></li>
            </ul>
            <div class="header__util">
                <a href="login.html" class="btn btn--ghost btn--small">로그인</a>
                <a href="signup.html" class="btn btn--ghost btn--small">회원가입</a>
                <a href="cart.html" class="btn btn--ghost btn--small cart-btn">
                    <span class="cart-badge">0</span>
                </a>
            </div>
            <button class="nav__toggle" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
        </nav>
    </header>

    <main>
        <section class="auth-form section">
            <div class="container">
                <h2 class="section__title">로그인</h2>
                <form>
                    <div class="form-group">
                        <label for="email">이메일</label>
                        <input type="email" id="email" placeholder="이메일을 입력하세요" required>
                    </div>
                    <div class="form-group">
                        <label for="password">비밀번호</label>
                        <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn--primary">로그인</button>
                    </div>
                </form>
                <div class="social-login">
                    <p>SNS 계정으로 간편 로그인</p>
                    <div class="social-login-buttons">
                        <button class="btn"><img src="assets/icon-naver.png" alt="네이버 로그인"></button>
                        <button class="btn"><img src="assets/icon-google.png" alt="구글 로그인"></button>
                        <button class="btn"><img src="assets/icon-kakao.png" alt="카카오 로그인"></button>
                    </div>
                </div>
                <p class="login-link">아직 회원이 아니신가요? <a href="signup.html">회원가입</a></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__container container">
            <p>&copy; 2025 Inner Kurly. All rights reserved.</p>
            <div class="footer__links">
                <a href="#">이용약관</a>
                <a href="#">개인정보처리방침</a>
            </div>
        </div>
    </footer>

    <script src="app.js" defer></script>
</body>
</html>
