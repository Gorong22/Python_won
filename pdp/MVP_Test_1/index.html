<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>MUMU Prototype Test</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <!-- ======================= INTRO ======================= -->
      <section id="introScreen" class="screen active">
        <div class="intro-bg-grid"></div>

        <div class="intro-collage">
          <img class="c-img c1" />
          <img class="c-img c2" />
          <img class="c-img c3" />
          <img class="c-img c4" />
        </div>

        <div class="intro-content fade-up">
          <h1 class="intro-title">방금 경험한 MUMU, 어떤 느낌이었나요?</h1>
          <p class="intro-desc">
            좋았던 부분도, 아쉬웠던 순간도<br />
            그대로 말해주세요.<br />
            당신의 피드백이 MUMU를 더 나아가게 합니다.
          </p>

          <button class="start-btn" onclick="startSurvey()">시작하기</button>
        </div>
      </section>

      <!-- ======================= SURVEY ======================= -->
      <section id="surveyScreen" class="screen survey">
        <div class="survey-wrap">
          <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
          </div>

          <div id="surveyContainer" class="survey-container">
            <!-- JS가 질문을 렌더링합니다 -->
          </div>

          <div class="nav-btns">
            <button id="prevBtn" class="nav-btn prev">이전</button>
            <button id="nextBtn" class="nav-btn next">다음</button>
            <button id="submitBtn" class="nav-btn submit">제출하기</button>
          </div>
        </div>
      </section>

      <!-- ======================= LOADING ======================= -->
      <div id="loadingScreen" class="loading">
        <div class="loader"></div>
      </div>

      <!-- ======================= ENDING ======================= -->
      <section id="endingScreen" class="screen ending">
        <div class="ending-card fade-up">
          <h2 class="ending-title">참여해주셔서 정말 감사합니다.</h2>

          <p class="ending-sub">
            여러분이 경험하며 남겨주신 생각들은<br />
            MUMU가 더 나은 선택을 할 수 있도록<br />
            정직한 기준이 되어줍니다.
            <br /><br />
            함께 시간을 써주신 마음,<br />
            소중하게 다루겠습니다.
          </p>

          <button class="close-btn" onclick="closeEnding()">닫기</button>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
