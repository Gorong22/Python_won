<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 생활습관 & 스트레스 타입 테스트</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="intro-card">
      <h1>나의 생활습관과<br>스트레스 관리 유형 알아보기</h1>
      <p>
        간단한 질문으로 나의 현재 컨디션을 점검하고<br />
        일상 속 활력을 더해줄 루틴을 추천받아 보세요.
      </p>

      <form id="userForm">
        <input type="text" id="name" name="name" placeholder="이름" required />
        <input type="text" id="gender" name="gender" placeholder="성별" required />
        <input type="number" id="age" name="age" placeholder="나이" required />
        <input type="email" id="email" name="email" placeholder="이메일" required />
        <button type="submit" class="btn-start">테스트 시작하기</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("userForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const userData = {
        name: document.getElementById("name").value,
        gender: document.getElementById("gender").value,
        age: document.getElementById("age").value,
        email: document.getElementById("email").value,
      };

      localStorage.setItem("userInfo", JSON.stringify(userData));
      window.location.href = "quiz.html";
    });
  </script>
</body>
</html>
