<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니 | 이너컬리</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="index.html" class="nav__logo">Inner Kurly</a>
            <ul class="nav__menu">
                <li class="nav__item"><a href="index.html#plates">추천 식단</a></li>
                <li class="nav__item"><a href="index.html#pricing">구독 상품</a></li>
                <li class="nav__item"><a href="index.html#reviews">고객 후기</a></li>
            </ul>
            <div class="header__util">
                <a href="login.html" class="btn btn--ghost btn--small">로그인</a>
                <a href="signup.html" class="btn btn--ghost btn--small">회원가입</a>
                <a href="cart.html" class="btn btn--ghost btn--small cart-btn">
                    🛒 <span class="cart-badge">0</span>
                </a>
            </div>
            <button class="nav__toggle" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
        </nav>
    </header>

    <main>
        <section class="cart-section section">
            <div class="container">
                <h2 class="section__title">장바구니</h2>
                <div class="cart-container">
                    <div class="cart-items" id="cart-items">
                        <!-- Cart items will be dynamically populated here -->
                        <div class="cart-empty-message">
                            <p>장바구니가 비어 있습니다.</p>
                            <a href="index.html#plates" class="btn btn--primary">식단 보러가기</a>
                        </div>
                    </div>
                    <div class="cart-summary-wrapper">
                        <div class="cart-summary">
                            <h3 class="cart-summary__title">결제 정보</h3>
                            <div class="cart-summary__row">
                                <span>총 상품 금액</span>
                                <span id="summary-subtotal">0원</span>
                            </div>
                            <div class="cart-summary__row">
                                <span>배송비</span>
                                <span id="summary-shipping">0원</span>
                            </div>
                            <div class="cart-summary__total">
                                <span>총 결제 금액</span>
                                <span id="summary-total">0원</span>
                            </div>
                            <button class="btn btn--primary btn--large checkout-btn">결제하기</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__container container">
            <p>&copy; 2025 Inner Kurly. All rights reserved.</p>
            <div class="footer__links">
                <a href="#">이용약관</a>
                <a href="#">개인정보처리방침</a>
            </div>
        </div>
    </footer>

    <script src="app.js" defer></script>
</body>
</html>
