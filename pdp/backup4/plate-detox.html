<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detox Plate | 이너컬리</title>
  <meta name="description" content="하루를 리셋하는 Detox Plate. 식이섬유와 클린푸드로 속부터 건강을 채우세요.">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="plate-detox">
  <!-- 헤더 -->
  <header class="header">
    <h1>Detox Plate</h1>
    <p>속까지 맑아지는 클린 루틴</p>
  </header>

  <!-- 메인 비주얼 -->
  <section class="hero">
    <img src="./images/detox-main.jpg" alt="Detox Plate 대표 이미지">
    <h2 class="section__title">Detox Plate</h2>
    <p>가벼운 하루를 위한 클린 이너뷰티 플레이트</p>
    <div class="hashtags">
      <span>#디톡스</span>
      <span>#클린푸드</span>
      <span>#식이섬유</span>
    </div>
    <button class="btn-cta">지금 시작하기</button>
  </section>

  <!-- 후기 섹션 -->
  <section class="reviews">
    <h3 class="section__title">고객 후기</h3>
    <div class="swiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">"먹고 나면 속이 편안해져요."</div>
        <div class="swiper-slide">"다이어트할 때도 배변활동에 도움돼요."</div>
        <div class="swiper-slide">"신선한 재료가 느껴져서 믿음이 갑니다."</div>
      </div>
    </div>
  </section>

  <!-- 멤버십 -->
  <section class="membership">
    <h3 class="section__title">이너컬리 멤버스 혜택</h3>
    <p>Detox Plate 구독 시 클린푸드 체험팩 + 디톡스 가이드북 제공</p>
    <button class="btn-cta">멤버십 합류하기</button>
  </section>

  <!-- 푸터 -->
  <footer class="footer">
    <p>&copy; 2025 InnerKurly. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    new Swiper('.swiper', {
      loop: true,
      autoplay: { delay: 2500 }
    });
  </script>
</body>
</html>
