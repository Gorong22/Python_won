<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 | 이너컬리</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="index.html" class="nav__logo">Inner Kurly</a>
            <ul class="nav__menu">
                <li class="nav__item"><a href="index.html#plates">이너플레이트</a></li>
                <li class="nav__item"><a href="index.html#reviews">후기</a></li>
                <li class="nav__item"><a href="index.html#app">루션 앱</a></li>
                <li class="nav__item"><a href="index.html#challenge">챌린지</a></li>
                <li class="nav__item"><a href="index.html#members">멤버스</a></li>
                <li class="nav__item"><a href="index.html#faq">FAQ</a></li>
            </ul>
            <div class="header__util">
                <a href="login.html" class="btn btn--ghost btn--small">로그인</a>
                <a href="signup.html" class="btn btn--ghost btn--small">회원가입</a>
                <a href="cart.html" class="btn btn--ghost btn--small cart-btn">
                    <span class="cart-badge">0</span>
                </a>
            </div>
            <button class="nav__toggle" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
        </nav>
    </header>

    <main>
        <section class="auth-section section">
            <div class="auth-form-container">
                <h2 class="section__title">회원가입</h2>
                <form class="auth-form">
                    <div class="form-group">
                        <label for="name">이름</label>
                        <input type="text" id="name" placeholder="이름을 입력하세요" required>
                    </div>
                    <div class="form-group">
                        <label for="email">이메일</label>
                        <input type="email" id="email" placeholder="이메일을 입력하세요" required>
                    </div>
                    <div class="form-group">
                        <label for="password">비밀번호</label>
                        <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">비밀번호 확인</label>
                        <input type="password" id="confirm-password" placeholder="비밀번호를 다시 입력하세요" required>
                    </div>
                    <div class="form-group form-group--checkbox">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">이용약관 및 개인정보처리방침에 동의합니다.</label>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn--primary">회원가입</button>
                    </div>
                </form>
                <div class="social-login">
                    <p class="social-login__title">SNS 계정으로 간편하게 가입</p>
                    <div class="social-login__buttons">
                         <button class="social-btn social-btn--kakao" aria-label="카카오로 가입">
                            <svg viewBox="0 0 32 32"><path d="M16 4.64c-6.96 0-12.64 4.48-12.64 10.08 0 3.52 2.24 6.624 5.76 8.48l-2.08 7.52 8.064-4.16c.96.16 1.92.256 2.88.256 6.96 0 12.64-4.48 12.64-10.08S22.96 4.64 16 4.64z"></path></svg>
                        </button>
                        <button class="social-btn social-btn--naver" aria-label="네이버로 가입">
                            <svg viewBox="0 0 32 32"><path d="M21.514 19.2H10.486V12.8h11.028v6.4z M16 4.64L4.64 4.64v22.72h11.36V19.2h-4.48V12.8h4.48V4.64h6.88l6.88 6.88v15.44h-4.48V19.2h4.48v-8.64L20.48 4.64H16z"></path></svg>
                        </button>
                        <button class="social-btn social-btn--google" aria-label="구글로 가입">
                            <svg viewBox="0 0 32 32"><path d="M16.96 17.216h7.808c.128.832.192 1.6.192 2.56 0 7.488-4.8 12.224-8 12.224-7.04 0-12.8-5.76-12.8-12.8s5.76-12.8 12.8-12.8c3.84 0 6.4 1.6 7.936 3.072l-2.56 2.496c-1.152-.96-2.816-1.92-5.376-1.92-4.416 0-7.616 3.648-7.616 8.128s3.2 8.128 7.616 8.128c5.056 0 6.976-3.264 7.232-4.928H16.96v-3.584z"></path></svg>
                        </button>
                    </div>
                </div>
                <p class="auth-link">이미 회원이신가요? <a href="login.html">로그인</a></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__container container">
            <p>&copy; 2025 Inner Kurly. All rights reserved.</p>
            <div class="footer__links">
                <a href="#">이용약관</a>
                <a href="#">개인정보처리방침</a>
            </div>
        </div>
    </footer>

    <script src="app.js" defer></script>
</body>
</html>
