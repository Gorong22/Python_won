<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MUMU – Creator Feed</title>

    <!-- community와 동일한 스타일 가져옴 -->
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/community.css" />
    <link rel="stylesheet" href="css/creator_feed.css" />
  </head>

  <body>
    <div class="app-frame">
      <!-- 상단 고정 헤더 -->
      <div id="header"></div>

      <!-- 스크롤 영역 -->
      <div class="app-scroll">
        <main class="page-container">
          <!-- 제목 + 상단 탭 -->
          <h2 class="community-title">게시판</h2>

          <div class="community-top-tabs">
            <a href="community.html" class="top-tab">게시글</a>
            <a href="creator_feed.html" class="top-tab active">작가 피드</a>
          </div>

          <!-- 카테고리 태그 (와이어프레임) -->
          <div class="category-tags">
            <span class="tag active">전체</span>
            <span class="tag">판타지</span>
            <span class="tag">액션</span>
            <span class="tag">일상</span>
            <span class="tag">스릴러</span>
            <span class="tag">개그</span>
          </div>

          <!-- 팔로우한 작가 -->
          <section class="follow-section">
            <div class="follow-header">
              <span class="follow-title">팔로우한 작가</span>
              <span class="more-btn">더보기</span>
            </div>

            <div class="follow-list">
              <div class="follow-item">
                <div class="follow-left">
                  <div class="profile-skeleton"></div>
                  <div class="follow-info">
                    <span class="name">작가명 1</span>
                    <span class="meta">로맨스 · 팔로워 1.2K</span>
                  </div>
                </div>
                <button class="follow-btn">팔로우</button>
              </div>

              <div class="follow-item">
                <div class="follow-left">
                  <div class="profile-skeleton"></div>
                  <div class="follow-info">
                    <span class="name">작가명 2</span>
                    <span class="meta">일상 · 팔로워 9.2K</span>
                  </div>
                </div>
                <button class="follow-btn">팔로우</button>
              </div>

              <div class="follow-item">
                <div class="follow-left">
                  <div class="profile-skeleton"></div>
                  <div class="follow-info">
                    <span class="name">작가명 3</span>
                    <span class="meta">스릴러 · 팔로워 1.1K</span>
                  </div>
                </div>
                <button class="follow-btn">팔로우</button>
              </div>
            </div>
          </section>

          <!-- 피드 제목 -->
          <h3 class="creator-feed-title">피드</h3>

          <!-- 피드 리스트 -->
          <section class="creator-feed-list">
            <!-- 카드 1 -->
            <div class="creator-card">
              <div class="creator-author">
                <div class="profile-skeleton"></div>
                <span class="nickname">작가 이름</span>
              </div>

              <div class="creator-title">얼레리꼴레리</div>
              <div class="creator-desc">폴라폴라 짱구야 노을자~~</div>

              <div class="tag-wrap">
                <span class="tag">액션</span>
                <span class="tag">일상</span>
              </div>

              <div class="thumbnail-skeleton"></div>

              <div class="creator-meta">
                <span>2025.11.27</span>
                <div class="right">
                  <span>❤️ 30</span>
                  <span>💬 30</span>
                </div>
              </div>
            </div>

            <!-- 카드 2 -->
            <div class="creator-card">
              <div class="creator-author">
                <div class="profile-skeleton"></div>
                <span class="nickname">작가 이름</span>
              </div>

              <div class="creator-title">얼레리꼴레리 2</div>
              <div class="creator-desc">또 놀러 왓지롱~</div>

              <div class="tag-wrap">
                <span class="tag">개그</span>
              </div>

              <div class="thumbnail-skeleton"></div>

              <div class="creator-meta">
                <span>2025.11.27</span>
                <div class="right">
                  <span>❤️ 30</span>
                  <span>💬 30</span>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>

      <!-- 탭바 -->
      <div id="tabbar"></div>
    </div>

    <!-- header / tabbar 로드 -->
    <script>
      fetch("components/header.html")
        .then((r) => r.text())
        .then((h) => (document.getElementById("header").innerHTML = h));

      fetch("components/tabbar.html")
        .then((r) => r.text())
        .then((h) => (document.getElementById("tabbar").innerHTML = h));
    </script>
  </body>
</html>
