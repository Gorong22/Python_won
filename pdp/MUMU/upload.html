<div class="page-content upload-container">
    <!-- Step 1: Image Selection -->
    <div id="upload-step-1" class="upload-step active">
        <p class="step-indicator">Step 1/3</p>
        <h2 class="step-title">어떤 작품을 보여줄까요?</h2>
        <input type="file" id="thumbnail-input" accept="image/*" hidden>
        <label for="thumbnail-input" class="thumbnail-select-box">
             <img id="thumbnail-preview" src="" alt="Thumbnail preview" style="display: none;">
            <div id="thumbnail-placeholder">
                <i class="fa-solid fa-photo-film"></i>
                <p>썸네일 이미지 선택</p>
            </div>
        </label>
        <div class="step-buttons">
            <button id="go-to-step-2" class="btn btn-primary btn-block" disabled>다음</button>
        </div>
    </div>

    <!-- Step 2: Details -->
    <div id="upload-step-2" class="upload-step">
        <p class="step-indicator">Step 2/3</p>
        <h2 class="step-title">작품 정보를 입력해주세요.</h2>
        <div class="input-group">
            <label for="work-title">제목</label>
            <input type="text" id="work-title" placeholder="내 작품 제목">
        </div>
        <div class="input-group">
            <label for="work-tags">태그</label>
            <input type="text" id="work-tags" placeholder="#웹툰 #판타지 (쉼표로 구분)">
        </div>
        <div class="step-buttons">
            <button id="back-to-step-1" class="btn btn-black">이전</button>
            <button id="go-to-step-3" class="btn btn-primary" style="flex-grow: 1;">다음</button>
        </div>
    </div>

    <!-- Step 3: Completion -->
    <div id="upload-step-3" class="upload-step">
        <p class="step-indicator">Step 3/3</p>
        <h2 class="step-title">업로드 준비 완료!</h2>
        <p class="text-secondary text-center">아래 버튼을 눌러 작품을 게시하세요.</p>
        <div class="step-buttons">
            <button id="back-to-step-2" class="btn btn-black">이전</button>
            <button id="finish-upload" class="btn btn-primary" style="flex-grow: 1;">내 작품 업로드하기</button>
        </div>
    </div>
</div>
