<div class="modal-overlay">
    <div class="modal-content">
        <h2 class="modal-title text-center mb-2">{{title}}</h2>
        <p class="modal-body text-center text-secondary mb-3">{{body}}</p>
        <div class="modal-actions">
            <button class="btn btn-block btn-primary" id="modal-confirm-btn">{{confirmText}}</button>
            <button class="btn btn-block btn-black mt-1" id="modal-cancel-btn">{{cancelText}}</button>
        </div>
    </div>
</div>
