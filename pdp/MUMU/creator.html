<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MUMU – 작가 홈</title>

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/creator.css" />
  </head>

  <body>
    <div class="app-frame">
      <!-- 상단 헤더 -->
      <div id="header"></div>

      <!-- 스크롤 영역 -->
      <div class="app-scroll">
        <main class="creator-page">
          <!-- 프로필 -->
          <section class="creator-profile">
            <img
              id="creatorProfileImg"
              class="creator-avatar"
              src=""
              alt="profile"
            />
            <h2 id="creatorName" class="creator-name">작가 이름</h2>

            <div id="creatorTags" class="creator-tags">
              <!-- <span>액션</span> <span>판타지</span> -->
            </div>

            <div class="creator-stats">
              <div class="stat-box">
                <span id="creatorPostCount" class="stat-number">0</span>
                <span class="stat-label">발표수</span>
              </div>
              <div class="stat-box">
                <span id="creatorFollower" class="stat-number">0</span>
                <span class="stat-label">팔로워</span>
              </div>
            </div>
          </section>

          <!-- 썸네일 그리드 -->
          <section class="creator-grid" id="creatorGrid">
            <!-- JS로 채움 -->
          </section>
        </main>
      </div>

      <!-- 탭바 -->
      <div id="tabbar"></div>
    </div>

    <script src="js/creator.js"></script>
    <script>
      fetch("components/header.html")
        .then((res) => res.text())
        .then((html) => (document.getElementById("header").innerHTML = html));

      fetch("components/tabbar.html")
        .then((res) => res.text())
        .then((html) => (document.getElementById("tabbar").innerHTML = html));
    </script>
  </body>
</html>
